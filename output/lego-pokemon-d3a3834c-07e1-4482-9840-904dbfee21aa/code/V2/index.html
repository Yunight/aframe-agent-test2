<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Pokémon – Nouveautés 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <div class="bg-studs"></div>

    <header class="ad-header">
      <img src="./brand-lego.svg" alt="logo" class="brand-logo">
      <span class="new-badge">NOUVEAU 2026</span>
    </header>

    <div class="carousel-wrapper">
      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-slide slide--packshot">
          <img src="./72152_Prod_en-gb.jpg" alt="LEGO Pokémon Pikachu et Poké Ball" class="product-img" draggable="false">
        </div>
        <div class="carousel-slide slide--lifestyle">
          <img src="./blt559eb617476f464f-72164_Prod_en-gb.jpg" alt="LEGO Pokémon SMART Play Pikachu" class="product-img" draggable="false">
        </div>
        <div class="carousel-slide slide--lifestyle">
          <img src="./blt85cf136cf937bd03-72167_Prod_en-gb.jpg" alt="LEGO Pokémon SMART Play Charizard" class="product-img" draggable="false">
        </div>
      </div>

      <div class="carousel-ui">
        <span class="slide-label" id="slideLabel">Pikachu &amp; Poké Ball</span>
        <div class="carousel-dots">
          <button class="dot active" data-index="0" aria-label="Diapositive 1"></button>
          <button class="dot" data-index="1" aria-label="Diapositive 2"></button>
          <button class="dot" data-index="2" aria-label="Diapositive 3"></button>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="accent-bar"></div>

    <div class="content-block">
      <span class="eyebrow">Découvrez les nouveautés</span>
      <h1 class="headline">LEGO<sup>®</sup> <em>Pokémon</em></h1>
      <p class="subhead" id="dynamicSubhead">Gamme 2026 — SMART Play</p>
      <p class="body-copy">Construis et joue avec tes Pokémon préférés — lumière, son et mouvement !</p>
    </div>

    <a class="cta-btn" href="https://www.lego.com/fr-fr/themes/pokemon">
      <span class="cta-label">Voir la collection</span>
    </a>

    <footer class="ad-footer">
      <span>© 2026 The LEGO Group. Pokémon © Nintendo / Creatures / GAME FREAK.</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
