<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Pokémon 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Background decoration -->
    <div class="bg-layer"></div>
    <div class="dot-grid"></div>

    <!-- Header bar -->
    <div class="ad-header">
      <img src="./brand-lego.svg" alt="logo" class="brand-logo">
      <span class="eyebrow">Nouveautés 2026</span>
    </div>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow">
      <div class="slide active" data-index="0">
        <img src="./72152_Prod_en-gb.jpg" alt="LEGO Pikachu & Poké Ball" class="product-img">
        <div class="slide-badge">Pikachu<br>&amp; Poké Ball</div>
      </div>
      <div class="slide" data-index="1">
        <img src="./blt559eb617476f464f-72164_Prod_en-gb.jpg" alt="LEGO SMART Play Pikachu" class="product-img">
        <div class="slide-badge">SMART<br>Play</div>
      </div>
      <div class="slide" data-index="2">
        <img src="./blt85cf136cf937bd03-72167_Prod_en-gb.jpg" alt="LEGO Charizard SMART" class="product-img">
        <div class="slide-badge">Charizard<br>&amp; Pikachu</div>
      </div>
    </div>

    <!-- Slide dots -->
    <div class="slide-dots" id="slideDots">
      <button class="dot active" data-idx="0" aria-label="Slide 1"></button>
      <button class="dot" data-idx="1" aria-label="Slide 2"></button>
      <button class="dot" data-idx="2" aria-label="Slide 3"></button>
    </div>

    <!-- Copy block -->
    <div class="copy-block">
      <h2 class="headline">Construis ton <em>Pokémon</em> !</h2>
      <p class="subhead">Lumière, son &amp; mouvement avec LEGO SMART</p>
    </div>

    <!-- CTA and footer -->
    <div class="ad-footer">
      <a class="cta-btn" href="https://www.lego.com/fr-fr/themes/pokemon">
        <span class="cta-label">Découvrir la collection</span>
      </a>
      <span class="body-copy">Disponible dès août 2026</span>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
