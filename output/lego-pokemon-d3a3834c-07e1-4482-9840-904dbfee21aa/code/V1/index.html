<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Pokémon – Nouveautés 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <div class="bg-deco"></div>

    <header class="ad-header">
      <img src="./brand-lego.svg" alt="logo" class="ad-logo">
      <span class="eyebrow">Nouveautés 2026</span>
    </header>

    <div class="headline-block">
      <h1 class="headline">Construis ton <em>aventure</em></h1>
      <p class="subhead">LEGO Pokémon est arrivé !</p>
    </div>

    <div class="carousel-wrap">
      <div class="carousel-track" id="carouselTrack">
        <div class="slide" data-index="0">
          <img src="./72152_Prod_en-gb.jpg" alt="Pikachu et Poké Ball" class="slide-img">
          <div class="slide-label">Pikachu &amp; Poké Ball</div>
        </div>
        <div class="slide" data-index="1">
          <img src="./blt559eb617476f464f-72164_Prod_en-gb.jpg" alt="LEGO SMART Play Pikachu" class="slide-img">
          <div class="slide-label">SMART Play – Pikachu interactif</div>
        </div>
        <div class="slide" data-index="2">
          <img src="./blt85cf136cf937bd03-72167_Prod_en-gb.jpg" alt="Charizard SMART Play" class="slide-img">
          <div class="slide-label">SMART Play – Charizard</div>
        </div>
      </div>

      <div class="carousel-dots" id="carouselDots">
        <button class="dot active" data-dot="0" aria-label="Slide 1"></button>
        <button class="dot" data-dot="1" aria-label="Slide 2"></button>
        <button class="dot" data-dot="2" aria-label="Slide 3"></button>
      </div>

      <button class="carousel-arrow arrow-prev" id="arrowPrev" aria-label="Précédent">&#8249;</button>
      <button class="carousel-arrow arrow-next" id="arrowNext" aria-label="Suivant">&#8250;</button>
    </div>

    <p class="body-copy">Lumière, son et mouvement — brique par brique.</p>

    <a class="cta-btn" href="https://www.lego.com/fr-fr/themes/pokemon">
      <span class="cta-label">Découvrir la collection</span>
    </a>

    <footer class="ad-footer">
      <span>© 2026 The LEGO Group. Pokémon et © Nintendo / Creatures / GAME FREAK</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
