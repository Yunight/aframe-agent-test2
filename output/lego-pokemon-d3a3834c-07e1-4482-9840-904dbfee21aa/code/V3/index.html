<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Pokémon – Nouveautés 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x600">

    <!-- Header -->
    <header class="ad-header">
      <img src="./brand-lego.svg" alt="logo" class="ad-logo">
      <span class="eyebrow">Nouveautés 2026</span>
    </header>

    <!-- Headline -->
    <div class="ad-headline-block">
      <h1 class="headline">LEGO<br><em>Pokémon</em></h1>
      <p class="subhead">Construis tes héros Pokémon,<br>brique par brique !</p>
    </div>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow" role="region" aria-label="Galerie produits">
      <div class="slide active" data-index="0">
        <img src="./72152_Prod_en-gb.jpg" alt="Pikachu et Poké Ball LEGO" class="slide-img">
        <div class="slide-caption">
          <span class="slide-label">Pikachu &amp; Poké Ball</span>
        </div>
      </div>
      <div class="slide" data-index="1">
        <img src="./blt559eb617476f464f-72164_Prod_en-gb.jpg" alt="LEGO SMART Play Pikachu interactif" class="slide-img">
        <div class="slide-caption">
          <span class="slide-label">SMART Play Pikachu</span>
        </div>
      </div>
      <div class="slide" data-index="2">
        <img src="./blt85cf136cf937bd03-72167_Prod_en-gb.jpg" alt="LEGO SMART Play Charizard" class="slide-img">
        <div class="slide-caption">
          <span class="slide-label">SMART Play Charizard</span>
        </div>
      </div>

      <!-- Dots -->
      <div class="slide-dots" role="tablist">
        <button class="dot active" data-dot="0" role="tab" aria-label="Slide 1"></button>
        <button class="dot" data-dot="1" role="tab" aria-label="Slide 2"></button>
        <button class="dot" data-dot="2" role="tab" aria-label="Slide 3"></button>
      </div>

      <!-- Arrows -->
      <button class="arrow arrow-prev" id="prevBtn" aria-label="Précédent">&#8249;</button>
      <button class="arrow arrow-next" id="nextBtn" aria-label="Suivant">&#8250;</button>
    </div>

    <!-- Body copy -->
    <div class="ad-body">
      <p class="body-copy">Lumière, son et mouvement avec<br><strong>LEGO SMART Play</strong> — dès 6 ans.</p>
    </div>

    <!-- CTA -->
    <div class="ad-cta-block">
      <a class="cta-btn" href="https://www.lego.com/fr-fr/themes/pokemon"><span class="cta-label">Découvrir la gamme</span></a>
    </div>

    <!-- Footer -->
    <footer class="ad-footer">
      <span>© 2026 The LEGO Group. Pokémon © Nintendo / Creatures / GAME FREAK.</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
