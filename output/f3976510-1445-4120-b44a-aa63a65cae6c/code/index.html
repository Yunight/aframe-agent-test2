<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Stellantis 2026</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@100;300;500;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 320px;
      height: 480px;
      overflow: hidden;
      background: #00133B;
      font-family: 'Encode Sans Expanded', Arial;
    }
    .wrap { position: relative; width: 320px; height: 480px; }
    .wrap a-scene { position: absolute; top: 0; left: 0; }
    .ui {
      position: absolute; top: 0; left: 0; width: 320px; height: 480px; z-index: 10;
      pointer-events: none; display: flex; flex-direction: column; align-items: center;
      font-family: 'Encode Sans Expanded', Arial;
    }
    .ui::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 150px;
      background: linear-gradient(180deg, #00133B 0%, #00133B 45%, rgba(0,19,59,0) 100%);
      z-index: 1; pointer-events: none;
    }
    .ui::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 140px;
      background: linear-gradient(0deg, #00133B 0%, #00133B 40%, rgba(0,19,59,0) 100%);
      z-index: 1; pointer-events: none;
    }
    .logo-wrap { position: relative; z-index: 2; margin-top: 18px; }
    .logo-img {
      width: 130px; height: auto; filter: brightness(0) invert(1);
      opacity: 0; animation: fadeIn 0.8s ease-out 0.3s forwards;
    }
    .headline-wrap { position: relative; z-index: 2; margin-top: 8px; text-align: center; }
    .headline {
      color: #FFFFFF; font-family: 'Encode Sans Expanded', Arial; font-weight: 800;
      font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em;
      line-height: 1.15; opacity: 0; animation: slideUp 0.8s ease-out 0.5s forwards;
    }
    .headline .accent { color: #E94E24; }
    .sub {
      margin-top: 3px; color: #43AAA0; font-family: 'Encode Sans Expanded', Arial;
      font-weight: 300; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.18em; opacity: 0; animation: slideUp 0.8s ease-out 0.75s forwards;
    }
    .spacer { flex: 1; }
    .info { position: relative; z-index: 2; width: 100%; text-align: center; padding: 0 16px; }
    .vname {
      color: #FFFFFF; font-family: 'Encode Sans Expanded', Arial; font-weight: 600;
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      transition: opacity 0.25s, transform 0.25s;
    }
    .vtag {
      color: #F39671; font-family: 'Encode Sans Expanded', Arial; font-weight: 100;
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em;
      margin-top: 2px; transition: opacity 0.25s, transform 0.25s;
    }
    .dots {
      display: flex; justify-content: center; gap: 8px; margin-top: 10px;
      pointer-events: all; position: relative; z-index: 20;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.2);
      cursor: pointer; transition: all 0.4s ease;
    }
    .dot.active {
      background: #E94E24; box-shadow: 0 0 8px rgba(233,78,36,0.5); transform: scale(1.3);
    }
    .hint {
      color: rgba(255,255,255,0.3); font-family: 'Encode Sans Expanded', Arial;
      font-weight: 100; font-size: 8px; text-transform: uppercase;
      letter-spacing: 0.15em; margin-top: 8px; opacity: 0;
      animation: fadeIn 1s ease-out 2.5s forwards;
    }
    .cta-wrap { position: relative; z-index: 20; padding: 12px 0 18px; pointer-events: all; }
    .cta {
      display: inline-block; padding: 10px 28px;
      background: linear-gradient(135deg, #E94E24, #EF7D00); color: #FFFFFF;
      font-family: 'Encode Sans Expanded', Arial; font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.1em; text-decoration: none;
      border: none; cursor: pointer; position: relative; overflow: hidden;
      opacity: 0; animation: slideUp 0.8s ease-out 1.2s forwards;
    }
    .cta::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 3s ease-in-out 2s infinite;
    }
    .cta:hover { filter: brightness(1.15); }
    .tap-zone {
      position: absolute; top: 120px; left: 0; width: 320px; height: 230px;
      pointer-events: all; cursor: pointer; z-index: 5;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { left: -100%; } 40%, 100% { left: 100%; } }
  </style>
</head>
<body>
<div class="wrap">
  <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true; colorManagement: true" background="color: #00133B" style="width: 320px; height: 480px;">
    <a-assets timeout="8000">
      <img id="v0" src="JeepCherokee2026-0.jpg">
      <img id="v1" src="2026_Jeep_Cherokee.jpg">
      <img id="v2" src="2026-Jeep-Cherokee-Overland.jpg">
      <img id="v3" src="stellantis-readies-no-less-than-12-new-models-from-six-brands-for-2026-canadian-autoshow-265527-7.jpg">
    </a-assets>

    <a-entity camera position="0 0 3" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>

    <a-entity id="stars"></a-entity>

    <a-ring position="0 -0.05 -0.6" radius-inner="1.35" radius-outer="1.37" material="shader: flat; color: #243782; opacity: 0.18; transparent: true" animation="property: rotation; to: 0 0 360; dur: 30000; easing: linear; loop: true"></a-ring>
    <a-ring position="0 -0.05 -0.4" radius-inner="1.55" radius-outer="1.56" material="shader: flat; color: #43AAA0; opacity: 0.08; transparent: true" animation="property: rotation; to: 0 0 -360; dur: 40000; easing: linear; loop: true"></a-ring>

    <a-entity id="vGroup" position="0 -0.05 0">
      <a-plane width="3.2" height="2.2" position="0 0 -0.12" material="shader: flat; color: #243782; opacity: 0.1; transparent: true" animation="property: material.opacity; from: 0.06; to: 0.18; dur: 3000; easing: easeInOutSine; loop: true; dir: alternate"></a-plane>
      <a-plane id="vPlane" src="#v0" width="2.8" height="2.1" material="shader: flat; transparent: true" position="0 0 0" scale="0.85 0.85 0.85"
        animation__enter="property: scale; from: 0.4 0.4 0.4; to: 0.85 0.85 0.85; dur: 900; easing: easeOutBack; delay: 500"
        animation__opIn="property: material.opacity; from: 0; to: 1; dur: 600; delay: 500"
        animation__idle="property: rotation; from: 0 -1.5 0; to: 0 1.5 0; dur: 5000; easing: easeInOutSine; loop: true; dir: alternate">
      </a-plane>
    </a-entity>

    <a-plane width="6" height="0.003" position="0 -1.4 -0.2" material="shader: flat; color: #243782; opacity: 0.35; transparent: true"></a-plane>
    <a-plane width="6" height="0.002" position="0 1.2 -0.2" material="shader: flat; color: #243782; opacity: 0.2; transparent: true"></a-plane>
  </a-scene>

  <div class="ui">
    <div class="logo-wrap"><img class="logo-img" src="Stellantis-Logo.png" alt="Stellantis"></div>
    <div class="headline-wrap">
      <div class="headline">La Nouvelle<br><span class="accent">Vague</span> 2026</div>
      <div class="sub">12 mod\/u00e8les \u00b7 6 marques</div>
    </div>
    <div class="spacer"></div>
    <div class="info">
      <div class="vname" id="vName">Jeep Cherokee 2026</div>
      <div class="vtag" id="vTag">Aventure sans limites</div>
      <div class="dots" id="dotsWrap"></div>
      <div class="hint">Tapez pour explorer</div>
    </div>
    <div class="cta-wrap"><a class="cta" href="https://www.stellantis.com" target="_blank">D\'ecouvrir \u2192</a></div>
    <div class="tap-zone" id="tapZone"></div>
  </div>
</div>

<script>
(function() {
  var vehicles = [
    { id: 'v0', name: 'Jeep Cherokee 2026', tag: 'Aventure sans limites', w: 2.8, h: 2.1 },
    { id: 'v1', name: 'Jeep Cherokee', tag: 'Force et \u00e9l\u00e9gance', w: 2.8, h: 1.47 },
    { id: 'v2', name: 'Cherokee Overland', tag: 'Le luxe tout-terrain', w: 2.8, h: 1.47 },
    { id: 'v3', name: 'Ram 1500', tag: 'Puissance red\u00e9finie', w: 2.8, h: 1.58 }
  ];
  var cur = 0, busy = false;

  var dotsWrap = document.getElementById('dotsWrap');
  vehicles.forEach(function(_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.dataset.idx = i;
    d.addEventListener('click', function(e) {
      e.stopPropagation();
      go(parseInt(this.dataset.idx));
    });
    dotsWrap.appendChild(d);
  });

  var scene = document.querySelector('a-scene');
  scene.addEventListener('loaded', function() {
    var field = document.getElementById('stars');
    var cols = ['#FFFFFF', '#43AAA0', '#A0D4CD', '#FFFFFF'];
    for (var i = 0; i < 50; i++) {
      var s = document.createElement('a-sphere');
      var r = 0.005 + Math.random() * 0.018;
      var c = cols[Math.floor(Math.random() * cols.length)];
      var o = 0.1 + Math.random() * 0.55;
      var px = (Math.random() - 0.5) * 5.5;
      var py = (Math.random() - 0.5) * 5;
      var pz = -1 - Math.random() * 4;
      s.setAttribute('radius', r);
      s.setAttribute('material', 'shader: flat; color: ' + c + '; opacity: ' + o + '; transparent: true');
      s.setAttribute('position', px + ' ' + py + ' ' + pz);
      s.setAttribute('animation', 'property: material.opacity; from: ' + (o * 0.2) + '; to: ' + o + '; dur: ' + (1200 + Math.random() * 3500) + '; easing: easeInOutSine; loop: true; dir: alternate; delay: ' + Math.floor(Math.random() * 2500));
      field.appendChild(s);
    }
  });

  function go(idx) {
    if (busy || idx === cur) return;
    busy = true;
    var plane = document.getElementById('vPlane');
    var v = vehicles[idx];

    plane.removeAttribute('animation__idle');
    plane.setAttribute('animation__fout', 'property: rotation; to: 0 90 0; dur: 260; easing: easeInCubic');
    plane.setAttribute('animation__sout', 'property: scale; to: 0.65 0.65 0.65; dur: 260; easing: easeInCubic');

    var nameEl = document.getElementById('vName');
    var tagEl = document.getElementById('vTag');
    nameEl.style.opacity = '0';
    nameEl.style.transform = 'translateY(6px)';
    tagEl.style.opacity = '0';
    tagEl.style.transform = 'translateY(6px)';

    setTimeout(function() {
      plane.setAttribute('src', '#' + v.id);
      plane.setAttribute('width', v.w);
      plane.setAttribute('height', v.h);
      plane.setAttribute('rotation', '0 -90 0');

      plane.setAttribute('animation__fin', 'property: rotation; from: 0 -90 0; to: 0 0 0; dur: 320; easing: easeOutCubic');
      plane.setAttribute('animation__sin', 'property: scale; from: 0.65 0.65 0.65; to: 0.85 0.85 0.85; dur: 320; easing: easeOutCubic');

      setTimeout(function() {
        nameEl.textContent = v.name;
        tagEl.textContent = v.tag;
        nameEl.style.opacity = '1';
        nameEl.style.transform = 'translateY(0)';
        tagEl.style.opacity = '1';
        tagEl.style.transform = 'translateY(0)';
      }, 80);

      dotsWrap.querySelectorAll('.dot').forEach(function(d, i) {
        d.classList.toggle('active', i === idx);
      });

      cur = idx;

      setTimeout(function() {
        plane.setAttribute('animation__idle', 'property: rotation; from: 0 -1.5 0; to: 0 1.5 0; dur: 5000; easing: easeInOutSine; loop: true; dir: alternate');
        busy = false;
      }, 350);
    }, 280);
  }

  document.getElementById('tapZone').addEventListener('click', function() {
    go((cur + 1) % vehicles.length);
    clearInterval(autoT);
    autoT = setInterval(function() { go((cur + 1) % vehicles.length); }, 5000);
  });

  var autoT = setInterval(function() { go((cur + 1) % vehicles.length); }, 5000);
})();
</script>
</body>
</html>
