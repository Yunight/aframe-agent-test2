<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1, user-scalable=no">
  <title>Toy Story 5</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:320px;height:480px;overflow:hidden;font-family:'Gill Sans';}
    #ad-container{width:320px;height:480px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1A48A0 0%,#1E1E2E 72%);}
    #ad-container::before{content:'';position:absolute;width:100%;height:100%;z-index:2;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 18px 28px,#FFEE15 40%,transparent 100%),radial-gradient(1px 1px at 88px 115px,#FFFFFF 50%,transparent 100%),radial-gradient(1.5px 1.5px at 255px 45px,#F9D445 40%,transparent 100%),radial-gradient(1px 1px at 145px 395px,#FFFFFF 50%,transparent 100%),radial-gradient(1px 1px at 298px 290px,#FFEE15 50%,transparent 100%),radial-gradient(1px 1px at 48px 440px,#7CC1E9 50%,transparent 100%),radial-gradient(1px 1px at 205px 195px,#FFFFFF 50%,transparent 100%),radial-gradient(1.5px 1.5px at 172px 58px,#F9D445 40%,transparent 100%),radial-gradient(1px 1px at 30px 240px,#FFEE15 50%,transparent 100%),radial-gradient(1px 1px at 290px 160px,#7CC1E9 50%,transparent 100%);animation:twinkle 3s ease-in-out infinite alternate;}
    @keyframes twinkle{0%{opacity:.35}100%{opacity:1}}
    #aframe-wrap{position:absolute;top:0;left:0;width:320px;height:480px;z-index:1;}
    #overlay{position:absolute;top:0;left:0;width:320px;height:480px;z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
    #overlay>*{pointer-events:auto;}
    .logo-wrap{margin-top:6px;position:relative;animation:bounceDown .9s cubic-bezier(.34,1.56,.64,1) .3s both;filter:drop-shadow(0 3px 12px rgba(18,18,18,.7));}
    .logo-wrap img{width:125px;height:auto;display:block;}
    .five-num{position:absolute;right:-14px;bottom:-6px;width:40px;height:40px;background:#F1060B;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #FFEE15;box-shadow:0 2px 12px rgba(18,18,18,.6);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .8s both;}
    .five-num span{font-family:'Gill Sans';font-weight:800;font-size:22px;color:#FFEE15;line-height:1;}
    .carousel-wrap{width:288px;height:162px;margin-top:8px;position:relative;border-radius:12px;overflow:hidden;border:2px solid #FFEE15;box-shadow:0 0 25px rgba(255,238,21,.2),0 8px 28px rgba(18,18,18,.5);animation:scaleIn .7s cubic-bezier(.34,1.56,.64,1) .6s both;cursor:pointer;}
    .carousel-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease;}
    .carousel-wrap img.active{opacity:1;}
    .carousel-wrap::after{content:'\276F';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#FFFFFF;font-family:'Gill Sans';font-size:20px;opacity:.6;text-shadow:0 1px 4px rgba(18,18,18,.6);pointer-events:none;transition:opacity .3s;}
    .carousel-wrap:hover::after{opacity:1;}
    .progress-track{width:288px;height:3px;margin-top:5px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;animation:fadeIn .5s ease 1.2s both;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#FFEE15,#F9D445);border-radius:2px;width:0%;}
    .carousel-dots{display:flex;gap:5px;margin-top:5px;animation:fadeIn .5s ease 1.2s both;}
    .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);transition:all .3s ease;cursor:pointer;}
    .dot.active{background:#FFEE15;border-color:#FFEE15;transform:scale(1.35);}
    .tagline{font-family:'Gill Sans';font-weight:700;font-size:18px;color:#FFEE15;text-align:center;margin-top:12px;text-shadow:0 2px 10px rgba(18,18,18,.7);letter-spacing:.3px;animation:fadeSlideUp .7s ease-out .9s both;}
    .sub-tagline{font-family:'Gill Sans';font-weight:400;font-size:12px;color:#E0E0E0;text-align:center;margin-top:3px;text-shadow:0 1px 5px rgba(18,18,18,.5);animation:fadeSlideUp .7s ease-out 1.1s both;}
    .date-badge{margin-top:10px;padding:5px 16px;background:rgba(255,238,21,.08);border:1px solid rgba(255,238,21,.22);border-radius:20px;animation:fadeSlideUp .7s ease-out 1.3s both;}
    .date-badge span{font-family:'Gill Sans';font-weight:700;font-size:12px;color:#FFFFFF;letter-spacing:.8px;}
    .cta-btn{margin-top:10px;padding:11px 30px;background:#F1060B;color:#FFFFFF;border:none;border-radius:30px;font-family:'Gill Sans';font-weight:600;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:1.2px;animation:popIn .6s cubic-bezier(.34,1.56,.64,1) 1.5s both;box-shadow:0 4px 20px rgba(241,6,11,.45);transition:transform .2s ease,box-shadow .2s ease;position:relative;overflow:hidden;}
    .cta-btn::after{content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);animation:shimmer 3s ease-in-out infinite 2.5s;}
    .cta-btn:hover{transform:scale(1.06);box-shadow:0 6px 28px rgba(241,6,11,.65);}
    .cta-btn:active{transform:scale(.97);}
    .cta-btn.clicked{animation:clickBurst .4s ease-out;}
    @keyframes bounceDown{from{transform:translateY(-70px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes scaleIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeSlideUp{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes popIn{from{transform:scale(0);opacity:0}60%{transform:scale(1.12)}to{transform:scale(1);opacity:1}}
    @keyframes shimmer{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}
    @keyframes clickBurst{0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
    @keyframes pulseGlow{0%,100%{box-shadow:0 4px 20px rgba(241,6,11,.45)}50%{box-shadow:0 4px 30px rgba(241,6,11,.7),0 0 15px rgba(255,238,21,.2)}}
    .cta-pulse{animation:pulseGlow 2s ease-in-out infinite 3s;}
  </style>
</head>
<body>
<div id="ad-container">
  <div id="aframe-wrap">
    <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true; colorManagement: true" loading-screen="enabled: false">
      <a-entity position="0 0 -4">
        <a-entity geometry="primitive: dodecahedron; radius: 0.22" material="color: #FFEE15; emissive: #FFEE15; emissiveIntensity: 0.3; flatShading: true; opacity: 0.8; transparent: true" position="-1.7 2.9 0" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear" animation__bob="property: position; from: -1.7 2.9 0; to: -1.7 3.3 0; dur: 2500; loop: true; dir: alternate; easing: easeInOutQuad"></a-entity>
        <a-box material="color: #1A48A0; emissive: #1A48A0; emissiveIntensity: 0.2; flatShading: true; opacity: 0.7; transparent: true" width="0.26" height="0.26" depth="0.26" position="2 2 -0.5" animation="property: rotation; to: 360 360 0; dur: 7000; loop: true; easing: linear" animation__bob="property: position; from: 2 2 -0.5; to: 2 2.5 -0.5; dur: 3000; loop: true; dir: alternate; easing: easeInOutQuad"></a-box>
        <a-entity geometry="primitive: tetrahedron; radius: 0.2" material="color: #F1060B; flatShading: true; opacity: 0.75; transparent: true" position="1.8 -1.5 0" animation="property: rotation; to: 360 0 360; dur: 6000; loop: true; easing: linear" animation__bob="property: position; from: 1.8 -1.5 0; to: 1.8 -1.1 0; dur: 2800; loop: true; dir: alternate; easing: easeInOutQuad"></a-entity>
        <a-sphere material="color: #4B9E3E; emissive: #4B9E3E; emissiveIntensity: 0.15; opacity: 0.65; transparent: true" radius="0.15" position="-2 -0.2 0.5" animation__bob="property: position; from: -2 -0.2 0.5; to: -2 0.15 0.5; dur: 2200; loop: true; dir: alternate; easing: easeInOutQuad"></a-sphere>
        <a-entity geometry="primitive: octahedron; radius: 0.16" material="color: #8B45A6; emissive: #8B45A6; emissiveIntensity: 0.25; flatShading: true; opacity: 0.7; transparent: true" position="-1.4 -2.7 0" animation="property: rotation; to: 0 360 360; dur: 5500; loop: true; easing: linear" animation__bob="property: position; from: -1.4 -2.7 0; to: -1.4 -2.3 0; dur: 3200; loop: true; dir: alternate; easing: easeInOutQuad"></a-entity>
        <a-box material="color: #7CC1E9; flatShading: true; opacity: 0.55; transparent: true" width="0.17" height="0.17" depth="0.17" position="1.5 3.1 -0.3" animation="property: rotation; to: 0 360 360; dur: 9000; loop: true; easing: linear" animation__bob="property: position; from: 1.5 3.1 -0.3; to: 1.5 3.4 -0.3; dur: 2600; loop: true; dir: alternate; easing: easeInOutQuad"></a-box>
        <a-entity geometry="primitive: dodecahedron; radius: 0.1" material="color: #F9D445; emissive: #F9D445; emissiveIntensity: 0.4; flatShading: true; opacity: 0.65; transparent: true" position="1.3 -3 0.5" animation="property: rotation; to: 360 0 0; dur: 4000; loop: true; easing: linear"></a-entity>
        <a-torus material="color: #864F34; flatShading: true; opacity: 0.6; transparent: true" radius="0.16" radius-tubular="0.04" position="-2 1.3 0.2" animation="property: rotation; to: 360 360 0; dur: 8000; loop: true; easing: linear" animation__bob="property: position; from: -2 1.3 0.2; to: -2 1.6 0.2; dur: 3500; loop: true; dir: alternate; easing: easeInOutQuad"></a-torus>
        <a-sphere material="color: #FFEE15; emissive: #FFEE15; emissiveIntensity: 0.6; opacity: 0.45; transparent: true" radius="0.06" position="0.6 3.3 0" animation__bob="property: position; from: 0.6 3.3 0; to: 0.6 3.6 0; dur: 1800; loop: true; dir: alternate; easing: easeInOutQuad"></a-sphere>
        <a-sphere material="color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.8; opacity: 0.35; transparent: true" radius="0.05" position="-0.9 -3.2 0.3" animation__bob="property: position; from: -0.9 -3.2 0.3; to: -0.9 -2.9 0.3; dur: 2000; loop: true; dir: alternate; easing: easeInOutQuad"></a-sphere>
        <a-entity geometry="primitive: tetrahedron; radius: 0.09" material="color: #FFEE15; flatShading: true; opacity: 0.5; transparent: true" position="2 -2.8 -0.2" animation="property: rotation; to: 0 0 360; dur: 6500; loop: true; easing: linear"></a-entity>
        <a-box material="color: #F1060B; flatShading: true; opacity: 0.4; transparent: true" width="0.12" height="0.12" depth="0.12" position="-1.8 -1.2 0.4" animation="property: rotation; to: 360 0 360; dur: 7500; loop: true; easing: linear" animation__bob="property: position; from: -1.8 -1.2 0.4; to: -1.8 -0.9 0.4; dur: 2900; loop: true; dir: alternate; easing: easeInOutQuad"></a-box>
      </a-entity>
      <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.5"></a-entity>
      <a-entity light="type: point; color: #FFEE15; intensity: 0.5; decay: 2; distance: 12" position="2 3 2"></a-entity>
      <a-entity light="type: point; color: #7CC1E9; intensity: 0.3; decay: 2; distance: 12" position="-2 -3 2"></a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
    </a-scene>
  </div>

  <div id="overlay">
    <div class="logo-wrap">
      <img src="Toy-Story-Logo-PNG-File.png" alt="Toy Story">
      <div class="five-num"><span>5</span></div>
    </div>

    <div class="carousel-wrap" id="carousel">
      <img src="g_movies_toystory5_still_5_61714e5f.jpg" class="active" alt="Woody et Buzz">
      <img src="g_movies_toystory5_still_3_52ea0cb0.jpg" alt="Tablette Lilypad">
      <img src="g_disneymovies_toystory5_6_b89f2798.jpg" alt="Buzz en action">
      <img src="g_movies_toystory5_still_4_bfeeaedc.jpg" alt="Jessie">
      <img src="g_disneymovies_toystory5_7_2ba88af6.jpg" alt="Nouveaux amis">
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="carousel-dots" id="dots">
      <div class="dot active" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
      <div class="dot" data-i="3"></div>
      <div class="dot" data-i="4"></div>
    </div>

    <div class="tagline">Les jouets contre la tech !</div>
    <div class="sub-tagline">L'aventure la plus épique de l'année</div>

    <div class="date-badge">
      <span>🎬 AU CINÉMA LE 19 JUIN</span>
    </div>

    <button class="cta-btn" id="ctaBtn">Réserver mes places</button>
  </div>
</div>

<script>
  (function(){
    var imgs=document.querySelectorAll('#carousel img');
    var dots=document.querySelectorAll('.dot');
    var fill=document.getElementById('progressFill');
    var cta=document.getElementById('ctaBtn');
    var cur=0;
    var INTERVAL=3500;
    var timer,progRAF,progStart;

    function animateProgress(){
      progStart=performance.now();
      function step(now){
        var elapsed=now-progStart;
        var pct=Math.min((elapsed/INTERVAL)*100,100);
        fill.style.width=pct+'%';
        if(pct<100) progRAF=requestAnimationFrame(step);
      }
      cancelAnimationFrame(progRAF);
      fill.style.width='0%';
      progRAF=requestAnimationFrame(step);
    }

    function go(i){
      imgs[cur].classList.remove('active');
      dots[cur].classList.remove('active');
      cur=i;
      imgs[cur].classList.add('active');
      dots[cur].classList.add('active');
      animateProgress();
    }

    function next(){go((cur+1)%imgs.length);}
    function start(){timer=setInterval(next,INTERVAL);animateProgress();}
    function reset(){clearInterval(timer);start();}

    document.getElementById('carousel').addEventListener('click',function(){next();reset();});
    dots.forEach(function(d){d.addEventListener('click',function(){go(+d.dataset.i);reset();});});

    cta.addEventListener('click',function(){
      cta.classList.add('clicked');
      setTimeout(function(){cta.classList.remove('clicked');},400);
    });

    var touchX=0;
    var car=document.getElementById('carousel');
    car.addEventListener('touchstart',function(e){touchX=e.touches[0].clientX;},{passive:true});
    car.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-touchX;
      if(Math.abs(dx)>30){
        if(dx<0) next(); else go((cur-1+imgs.length)%imgs.length);
        reset();
      }
    });

    setTimeout(function(){cta.classList.add('cta-pulse');},4000);

    start();
  })();
</script>
</body>
</html>
