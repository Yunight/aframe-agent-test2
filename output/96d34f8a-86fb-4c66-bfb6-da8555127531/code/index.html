<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320,initial-scale=1">
<title>The Mandalorian &amp; Grogu</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script>
AFRAME.registerComponent('starfield',{
  schema:{count:{default:50}},
  init:function(){
    var pal=['#FFFFFF','#FFFFFF','#E5C76B','#8B6BC0'];
    for(var i=0;i<this.data.count;i++){
      var s=document.createElement('a-entity');
      var x=(Math.random()-.5)*10,y=(Math.random()-.5)*8,z=-2-Math.random()*4;
      var r=.005+Math.random()*.013;
      var c=pal[~~(Math.random()*pal.length)];
      var o=.3+Math.random()*.6;
      s.setAttribute('geometry','primitive:sphere;radius:'+r);
      s.setAttribute('material','shader:flat;color:'+c+';opacity:'+o);
      s.setAttribute('position',x+' '+y+' '+z);
      s.setAttribute('animation',{property:'material.opacity',from:o*.2,to:o,dur:1200+Math.random()*2800,easing:'easeInOutSine',loop:true,dir:'alternate',delay:Math.random()*2500});
      this.el.appendChild(s);
    }
  }
});

AFRAME.registerComponent('force-dust',{
  schema:{count:{default:10}},
  init:function(){
    var cols=['#6B3FA0','#8B6BC0','#C9A227','#E5C76B'];
    for(var i=0;i<this.data.count;i++){
      var p=document.createElement('a-entity');
      var x=(Math.random()-.5)*5,y=(Math.random()-.5)*5,z=-.5+Math.random()*2;
      var r=.007+Math.random()*.018;
      p.setAttribute('geometry','primitive:sphere;radius:'+r);
      p.setAttribute('material','shader:flat;color:'+cols[~~(Math.random()*cols.length)]+';opacity:'+(0.1+Math.random()*.25));
      p.setAttribute('position',x+' '+y+' '+z);
      p.setAttribute('animation',{property:'position',to:(x+(Math.random()-.5)*1.2)+' '+(y+(Math.random()-.5)*1.5)+' '+z,dur:4000+Math.random()*5000,easing:'easeInOutSine',loop:true,dir:'alternate'});
      p.setAttribute('animation__o',{property:'material.opacity',from:.05,to:.25+Math.random()*.2,dur:2500+Math.random()*3500,easing:'easeInOutSine',loop:true,dir:'alternate'});
      this.el.appendChild(p);
    }
  }
});

AFRAME.registerComponent('parallax-layer',{
  schema:{factor:{default:0.1}},
  init:function(){
    this.bx=this.el.object3D.position.x;this.by=this.el.object3D.position.y;
    this.tx=0;this.ty=0;this.cx=0;this.cy=0;
    var self=this;
    function h(px,py){self.tx=(px/320-.5)*self.data.factor;self.ty=(py/480-.5)*-self.data.factor;}
    document.addEventListener('mousemove',function(e){h(e.clientX,e.clientY);});
    document.addEventListener('touchmove',function(e){if(e.touches[0])h(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  },
  tick:function(){
    this.cx+=(this.tx-this.cx)*.04;this.cy+=(this.ty-this.cy)*.04;
    this.el.object3D.position.x=this.bx+this.cx;
    this.el.object3D.position.y=this.by+this.cy;
  }
});

AFRAME.registerComponent('gentle-sway',{
  tick:function(t){
    this.el.object3D.rotation.z=Math.sin(t/10000)*.015;
  }
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:320px;height:480px;overflow:hidden;background:#000000}
#ad{position:relative;width:320px;height:480px;overflow:hidden}

.ov{position:absolute;pointer-events:none}
.ov-v{top:0;left:0;width:320px;height:480px;background:radial-gradient(ellipse at 50% 42%,transparent 28%,rgba(0,0,0,.65) 100%);z-index:10}
.ov-t{top:0;left:0;width:320px;height:110px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);z-index:11}
.ov-b{bottom:0;left:0;width:320px;height:250px;background:linear-gradient(to top,rgba(0,0,0,.96) 10%,rgba(0,0,0,.75) 45%,transparent);z-index:11}
.ov-s{left:0;width:320px;height:50px;background:linear-gradient(to bottom,transparent,rgba(107,63,160,.05),rgba(201,162,39,.03),transparent);z-index:12;animation:sb 5s linear infinite}
@keyframes sb{0%{top:-50px}100%{top:480px}}
.ov-fr{top:4px;left:4px;width:312px;height:472px;border:1px solid rgba(107,63,160,.12);border-radius:2px;z-index:13}

.ui{position:absolute;top:0;left:0;width:320px;height:480px;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center}

.hd{padding-top:14px;text-align:center;animation:fd .8s ease-out .4s both}
.hd img{width:66px;height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 0 8px rgba(201,162,39,.45))}
.sub{font-family:'Franklin Gothic Demi',sans-serif;font-weight:500;font-size:8px;color:#C9A227;letter-spacing:3.5px;text-transform:uppercase;text-shadow:0 0 8px rgba(201,162,39,.35)}

.sp{flex:1}

.ft{padding-bottom:14px;text-align:center;animation:fu .8s ease-out .7s both;width:100%}
.mlogo{width:195px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 2px 10px rgba(107,63,160,.4))}

.filmstrip{display:flex;gap:3px;justify-content:center;margin-bottom:8px;opacity:.55}
.filmstrip img{width:44px;height:25px;object-fit:cover;border:1px solid rgba(139,107,192,.35);border-radius:1px;display:block}

.dots{display:flex;gap:5px;justify-content:center;margin-bottom:8px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .35s ease;pointer-events:all;cursor:pointer}
.dot.on{background:#C9A227;box-shadow:0 0 5px rgba(201,162,39,.65);transform:scale(1.3)}

.dt{font-family:'Avenir Next',sans-serif;font-weight:600;font-size:10px;color:#E5C76B;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 6px rgba(229,199,107,.25)}

.cta{pointer-events:all;padding:10px 24px;background:linear-gradient(135deg,#6B3FA0,#C9A227);color:#FFFFFF;font-family:'Avenir Next',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(229,199,107,.25);border-radius:2px;cursor:pointer;animation:gp 2.5s ease-in-out infinite;transition:transform .2s ease}
.cta:hover,.cta:active{transform:scale(1.05)}

.ht{font-family:'Avenir Next',sans-serif;font-weight:400;font-size:7px;color:#8A8D8F;margin-top:7px;letter-spacing:.8px;opacity:.45}

.clg{position:absolute;top:68px;right:10px;width:30px;height:auto;opacity:.35;z-index:21;pointer-events:none;animation:fd 1s ease-out 1.2s both;filter:drop-shadow(0 0 4px rgba(139,107,192,.3))}

@keyframes fd{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes gp{0%,100%{box-shadow:0 0 10px rgba(107,63,160,.3),0 0 20px rgba(201,162,39,.12)}50%{box-shadow:0 0 18px rgba(107,63,160,.55),0 0 36px rgba(201,162,39,.25)}}
</style>
</head>
<body>
<div id="ad">

  <a-scene embedded vr-mode-ui="enabled: false" renderer="colorManagement: true; antialias: true" loading-screen="enabled: false" style="width:320px;height:480px;">
    <a-assets timeout="15000">
      <img id="t0" src="./star-wars-the-mandalorian-and-grogu-key-art-poster_88038249.jpg">
      <img id="t1" src="./g_disneymovies_starwarsthemandalorianandgrogu_still_000_6e47c0dc.jpg">
      <img id="t2" src="./g_studios_themandalorianandgrogu_still_4_b1013c58.jpg">
      <img id="t3" src="./star-wars-the-mandalorian-and-grogu-first-looks-stills-_10a622a3.jpg">
      <img id="t4" src="./star_wars_the_mandalorian_and_grogu.jpg">
      <img id="t5" src="./grogus1.jpg">
    </a-assets>

    <a-entity camera position="0 0 3" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
    <a-sky color="#1A1A2E"></a-sky>

    <a-entity starfield="count: 45"></a-entity>
    <a-entity force-dust="count: 10"></a-entity>

    <!-- Main image carousel with parallax depth and gentle rotation sway -->
    <a-entity id="carG" parallax-layer="factor: .2" gentle-sway>
      <!-- Slide 0: Official theatrical key art poster featuring the Mandalorian in beskar armor and Grogu against a sweeping galactic backdrop with dramatic cinematic lighting -->
      <a-plane id="s0" src="#t0" width="2.6" height="3.85" position="0 0 -.5" material="shader: flat; transparent: true; opacity: 1"></a-plane>
      <!-- Slide 1: Wide production still capturing an action-packed scene from the film with expansive environments and cinematic composition -->
      <a-plane id="s1" src="#t1" width="3.2" height="1.8" position="0 0 -.5" material="shader: flat; transparent: true; opacity: 0"></a-plane>
      <!-- Slide 2: Production still showcasing a pivotal character moment with dramatic framing and rich color grading -->
      <a-plane id="s2" src="#t2" width="3.2" height="1.8" position="0 0 -.5" material="shader: flat; transparent: true; opacity: 0"></a-plane>
      <!-- Slide 3: First-look still revealing key imagery from the film in a wider aspect with deep visual scope -->
      <a-plane id="s3" src="#t3" width="3.2" height="2.13" position="0 0 -.5" material="shader: flat; transparent: true; opacity: 0"></a-plane>
      <!-- Slide 4: Alternative theatrical poster with a unique artistic composition in vertical portrait format -->
      <a-plane id="s4" src="#t4" width="2.2" height="3.26" position="0 0 -.5" material="shader: flat; transparent: true; opacity: 0"></a-plane>
    </a-entity>

    <!-- Floating accent: grogus1.jpg (800x499) — image of the Mandalorian in full beskar armor, used as a floating depth fragment to create a layered holographic feel -->
    <a-entity parallax-layer="factor: .35">
      <a-plane src="#t5" width=".8" height=".5" position=".95 -1.05 .8" material="shader: flat; transparent: true; opacity: .6" animation="property: position; to: .95 -.95 .8; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate"></a-plane>
    </a-entity>
  </a-scene>

  <!-- Cinematic overlay layers for depth and atmosphere -->
  <div class="ov ov-v"></div>
  <div class="ov ov-t"></div>
  <div class="ov ov-b"></div>
  <div class="ov ov-s"></div>
  <div class="ov ov-fr"></div>

  <!-- mandalorian_PNG1.png (768x456): Star Wars franchise logo emblem in PNG with transparency, positioned as a subtle corner accent badge -->
  <img src="./mandalorian_PNG1.png" class="clg" alt="Star Wars emblem">

  <!-- HTML UI Overlay -->
  <div class="ui">
    <div class="hd">
      <!-- star-wars.png (800x800): Iconic square-format Star Wars franchise logo or Mandalorian and Grogu movie title lockup with gold stylised typography -->
      <img src="./star-wars.png" alt="Star Wars">
      <div class="sub">La saga continue</div>
    </div>
    <div class="sp"></div>
    <div class="ft">
      <!-- the-mandalorian-and-grogu-new-logo.jpg (2560x1447): Wide official movie title treatment and logo banner featuring the distinctive Mandalorian and Grogu branding imagery -->
      <img src="./the-mandalorian-and-grogu-new-logo.jpg" class="mlogo" alt="The Mandalorian and Grogu">

      <!-- Film strip: 4 additional product images as decorative scene preview thumbnails -->
      <div class="filmstrip">
        <!-- g_disneymovies...d610a3d4.jpg (1300x730): Production still with character interactions and atmospheric dramatic lighting -->
        <img src="./g_disneymovies_starwarsthemandalorianandgrogu_still_000_d610a3d4.jpg" alt="">
        <!-- g_studios...still_5 (1300x730): Production still capturing another key emotional moment from the film -->
        <img src="./g_studios_themandalorianandgrogu_still_5_e858b4a8.jpg" alt="">
        <!-- star-wars...stills-20260416-03 (1545x1080): Promotional still showing a pivotal scene from the film -->
        <img src="./star-wars-the-mandalorian-and-grogu-stills-20260416-03_cb8075da.jpg" alt="">
        <!-- star_wars...ver12.jpg (607x755): Alternative portrait-format promotional poster with a different artistic direction -->
        <img src="./star_wars_the_mandalorian_and_grogu_ver12.jpg" alt="">
      </div>

      <div class="dots">
        <div class="dot on" data-i="0"></div>
        <div class="dot" data-i="1"></div>
        <div class="dot" data-i="2"></div>
        <div class="dot" data-i="3"></div>
        <div class="dot" data-i="4"></div>
      </div>
      <div class="dt">Au cin\'ema le 22 mai 2026</div>
      <button class="cta" id="ctaBtn">R\u00e9servez vos places</button>
      <div class="ht">\u2726 D\u00e9placez pour explorer \u2726</div>
    </div>
  </div>

</div>

<script>
(function(){
  var cur=0,n=5,ids=['s0','s1','s2','s3','s4'];
  var dots=document.querySelectorAll('.dot');
  function go(i){
    if(i===cur)return;
    var oel=document.getElementById(ids[cur]);
    oel.removeAttribute('animation__fi');
    oel.setAttribute('animation__fo',{property:'material.opacity',to:0,dur:450,easing:'easeInOutQuad'});
    setTimeout(function(){
      var nel=document.getElementById(ids[i]);
      nel.removeAttribute('animation__fo');
      nel.setAttribute('animation__fi',{property:'material.opacity',to:1,dur:550,easing:'easeInOutQuad'});
    },200);
    for(var d=0;d<dots.length;d++) dots[d].classList.toggle('on',d===i);
    cur=i;
  }
  var tmr=setInterval(function(){go((cur+1)%n);},4200);
  for(var j=0;j<dots.length;j++){
    dots[j].addEventListener('click',function(){
      clearInterval(tmr);
      go(parseInt(this.getAttribute('data-i')));
      tmr=setInterval(function(){go((cur+1)%n);},4200);
    });
  }
  var strips=document.querySelectorAll('.filmstrip img');
  for(var k=0;k<strips.length;k++){
    strips[k].style.pointerEvents='all';
    strips[k].style.cursor='pointer';
    strips[k].style.transition='all .3s ease';
    strips[k].addEventListener('mouseenter',function(){this.style.opacity='1';this.style.borderColor='#C9A227';this.style.transform='scale(1.1)';});
    strips[k].addEventListener('mouseleave',function(){this.style.opacity='';this.style.borderColor='';this.style.transform='';});
  }
})();
</script>
</body>
</html>
