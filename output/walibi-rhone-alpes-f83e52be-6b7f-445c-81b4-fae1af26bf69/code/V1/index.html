<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walibi Rhône-Alpes – Été 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Jost:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <!-- Background slide show -->
    <div class="bg-slides" aria-hidden="true">
      <div class="slide slide-1" style="background-image:url('./04-parcnov2021.jpg')"></div>
      <div class="slide slide-2" style="background-image:url('./07-parcnov2021.jpg')"></div>
      <div class="slide slide-3" style="background-image:url('./walibi-ra-2022-0017.jpg')"></div>
      <div class="slide slide-4" style="background-image:url('./tournage-walibi-0123.jpg')"></div>
    </div>

    <!-- Dark gradient overlay -->
    <div class="overlay" aria-hidden="true"></div>

    <!-- Header / Logo -->
    <header class="ad-header">
      <img src="./wra.svg" alt="logo" class="brand-logo">
    </header>

    <!-- Eyebrow -->
    <p class="eyebrow">Saison 2026</p>

    <!-- Hero headline -->
    <h1 class="headline">L'Été<br><em>WAAA</em>U<br>commence ici !</h1>

    <!-- Subhead -->
    <p class="subhead">36 attractions · Frissons &amp; évasion<br>pour toute la famille</p>

    <!-- Product hero strip -->
    <div class="product-strip" aria-hidden="true">
      <img src="./walibi-shooting-pub-2025---0031.jpg" alt="Roller coaster Walibi" class="product-hero-img">
    </div>

    <!-- Body copy -->
    <p class="body-copy">Découvrez trois mondes thématiques inoubliables au cœur de la région Auvergne-Rhône-Alpes.</p>

    <!-- CTA -->
    <a class="cta-btn" href="https://www.walibi.fr/fr" rel="noopener">
      <span class="cta-label">Réservez vos billets</span>
    </a>

    <!-- Footer -->
    <footer class="ad-footer">
      <span>walibi.fr · Les Avenières (38) · Ouvert cet été</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
