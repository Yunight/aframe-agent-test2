<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walibi Rhône-Alpes – Été 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Jost:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Background image slider -->
    <div class="slide-track">
      <div class="slide active" style="background-image:url('./walibi-shooting-pub-2025---0031.jpg'); background-position: center center;"></div>
      <div class="slide" style="background-image:url('./04-parcnov2021.jpg'); background-position: center top;"></div>
      <div class="slide" style="background-image:url('./07-parcnov2021.jpg'); background-position: center top;"></div>
      <div class="slide" style="background-image:url('./walibi-ra-2022-0017.jpg'); background-position: center center;"></div>
    </div>

    <!-- Overlay gradient -->
    <div class="overlay"></div>

    <!-- Eyebrow -->
    <span class="eyebrow">Parc d'attractions</span>

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="./wra.svg" alt="logo" class="logo">
    </div>

    <!-- Headline -->
    <h1 class="headline">L'été <em>WAAA</em></h1>
    <p class="subhead">commence ici !</p>

    <!-- Body copy -->
    <p class="body-copy">36 attractions · sensations &amp; fous rires</p>

    <!-- CTA -->
    <a class="cta-btn" href="https://www.walibi.fr/fr" target="_blank" rel="noopener">
      <span class="cta-label">Réservez maintenant</span>
    </a>

    <!-- Slide dots -->
    <div class="dots">
      <button class="dot active" data-idx="0" aria-label="Slide 1"></button>
      <button class="dot" data-idx="1" aria-label="Slide 2"></button>
      <button class="dot" data-idx="2" aria-label="Slide 3"></button>
      <button class="dot" data-idx="3" aria-label="Slide 4"></button>
    </div>

    <!-- Footer -->
    <footer class="ad-footer">
      <span>walibi.fr · Été 2026 · Les Avenières, Isère</span>
    </footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
