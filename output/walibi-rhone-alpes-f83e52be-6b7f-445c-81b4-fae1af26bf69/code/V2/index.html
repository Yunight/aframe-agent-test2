<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Été à Walibi Rhône-Alpes 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Jost:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <!-- Full-bleed hero carousel -->
    <div class="carousel">
      <div class="carousel-slide active"
           style="background-image:url('./walibi-shooting-pub-2025---0031.jpg');background-position:center 45%;"></div>
      <div class="carousel-slide"
           style="background-image:url('./04-parcnov2021.jpg');background-position:center 30%;"></div>
      <div class="carousel-slide"
           style="background-image:url('./07-parcnov2021.jpg');background-position:center 25%;"></div>
      <div class="carousel-slide"
           style="background-image:url('./walibi-ra-2022-0017.jpg');background-position:center center;"></div>
    </div>

    <!-- Dark gradient overlay for legibility -->
    <div class="overlay"></div>

    <!-- Header: logo + season badge -->
    <header class="ad-header">
      <img src="./wra.svg" alt="logo" class="logo">
      <span class="season-badge">ÉTÉ 2026</span>
    </header>

    <!-- Product hero image between header and text content -->
    <img src="./walibi-shooting-pub-2025---0031.jpg" class="hero-img" alt="Walibi Rhône-Alpes attraction">

    <!-- Main copy block -->
    <main class="ad-content">
      <p class="eyebrow">Sensations · Famille · Aventure</p>
      <h1 class="headline">L'Été Walibi<em>commence ici !</em></h1>
      <p class="subhead">36 attractions pour toute la famille</p>
      <a class="cta-btn" href="https://www.walibi.fr/fr">
        <span class="cta-label">Réserver mes billets</span>
        <span class="cta-arrow" aria-hidden="true">→</span>
      </a>
    </main>

    <!-- Slide progress dots -->
    <nav class="carousel-dots">
      <button class="dot active" data-index="0" aria-label="Slide 1"></button>
      <button class="dot" data-index="1" aria-label="Slide 2"></button>
      <button class="dot" data-index="2" aria-label="Slide 3"></button>
      <button class="dot" data-index="3" aria-label="Slide 4"></button>
    </nav>

    <!-- Legal footer -->
    <footer class="ad-footer">
      <span>walibi.fr — Ouvert cet été · Les Avenières, Isère</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
