<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <title>Nintendo Switch 2 - Publicité</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:320px;height:480px;overflow:hidden;font-family:'Montserrat',sans-serif;background:#000}
    #ad-container{position:relative;width:320px;height:480px;overflow:hidden;cursor:pointer}
    #bg-gradient{position:absolute;top:0;left:0;width:320px;height:480px;background:radial-gradient(ellipse at 50% 35%,#1a0a1e 0%,#0a0a12 50%,#000 100%);z-index:0}
    #red-glow{position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:320px;height:220px;background:radial-gradient(ellipse,rgba(230,0,18,0.14) 0%,transparent 70%);z-index:1;animation:glowPulse 4s ease-in-out infinite}
    #cyan-glow{position:absolute;bottom:-40px;left:-40px;width:220px;height:220px;background:radial-gradient(ellipse,rgba(0,195,227,0.08) 0%,transparent 70%);z-index:1}
    @keyframes glowPulse{0%,100%{opacity:0.7}50%{opacity:1}}
    .scene-wrapper{position:absolute;top:0;left:0;width:320px;height:480px;z-index:5}
    .overlay{position:absolute;top:0;left:0;width:320px;height:480px;pointer-events:none;z-index:10;display:flex;flex-direction:column;align-items:center}
    .top-bar{width:100%;display:flex;justify-content:center;align-items:center;padding:20px 16px 0}
    .logo-img{width:105px;height:auto;filter:drop-shadow(0 0 10px rgba(230,0,18,0.35))}
    .tagline-container{margin-top:8px;text-align:center}
    .tagline{color:#E60012;font-size:8.5px;font-weight:800;letter-spacing:4.5px;text-transform:uppercase;text-shadow:0 0 12px rgba(230,0,18,0.3)}
    .product-space{flex:1}
    .bottom-content{padding:0 20px 20px;text-align:center;width:100%}
    .headline{color:#FFF;font-size:30px;font-weight:900;line-height:1;letter-spacing:-0.5px;text-shadow:0 0 30px rgba(230,0,18,0.3)}
    .headline .accent{color:#E60012;text-shadow:0 0 20px rgba(230,0,18,0.6)}
    .sub{color:#989898;font-size:11px;font-weight:400;line-height:1.55;margin-top:7px}
    .sub b{color:#ccc;font-weight:700}
    .cta-wrapper{margin-top:16px}
    .cta-button{pointer-events:all;display:inline-block;background:linear-gradient(135deg,#E60012 0%,#FF4554 100%);color:#FFF;font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:800;padding:11px 34px;border:none;border-radius:25px;cursor:pointer;text-transform:uppercase;letter-spacing:2.5px;box-shadow:0 0 25px rgba(230,0,18,0.45),0 4px 15px rgba(0,0,0,0.6);transition:all 0.3s ease;animation:ctaPulse 2.5s ease-in-out infinite;position:relative;overflow:hidden}
    .cta-button::after{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transform:skewX(-20deg);animation:shimmer 3s ease-in-out infinite}
    @keyframes shimmer{0%,100%{left:-60%}50%{left:120%}}
    .cta-button:hover{transform:scale(1.08);box-shadow:0 0 45px rgba(230,0,18,0.7),0 4px 20px rgba(0,0,0,0.7)}
    @keyframes ctaPulse{0%,100%{box-shadow:0 0 20px rgba(230,0,18,0.3),0 4px 15px rgba(0,0,0,0.6)}50%{box-shadow:0 0 40px rgba(230,0,18,0.6),0 4px 20px rgba(0,0,0,0.6)}}
    .hint{color:rgba(255,255,255,0.18);font-size:8px;margin-top:10px;letter-spacing:1.5px;font-weight:400}
    .red-line-top{position:absolute;top:68px;left:0;width:320px;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(230,0,18,0.25) 50%,transparent 100%);z-index:11}
    .red-line-bottom{position:absolute;bottom:155px;left:0;width:320px;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(230,0,18,0.15) 50%,transparent 100%);z-index:11}
    .product-counter{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:12;display:flex;flex-direction:column;gap:6px;pointer-events:none}
    .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all 0.4s ease}
    .dot.active{background:#E60012;box-shadow:0 0 8px rgba(230,0,18,0.6)}
    .a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}
    .a-loader-title{display:none!important}
    .a-canvas{position:absolute!important}
  </style>
</head>
<body>
  <div id="ad-container">
    <div id="bg-gradient"></div>
    <div id="red-glow"></div>
    <div id="cyan-glow"></div>

    <div class="scene-wrapper">
      <a-scene embedded vr-mode-ui="enabled:false" renderer="colorManagement:true;antialias:true;alpha:true" loading-screen="enabled:false">
        <a-assets timeout="10000">
          <img id="product1" src="System-screen2.png" crossorigin="anonymous">
          <img id="product2" src="System-docked.png" crossorigin="anonymous">
          <img id="product3" src="features-tabletop-console.png" crossorigin="anonymous">
          <img id="product4" src="welcome-feature-product-batch.png" crossorigin="anonymous">
        </a-assets>

        <a-entity camera position="0 0 4" look-controls="enabled:false" wasd-controls="enabled:false" fov="58"></a-entity>

        <a-entity light="type:ambient;color:#222233;intensity:0.5"></a-entity>
        <a-entity light="type:point;color:#E60012;intensity:1.0;distance:14" position="2.5 3 3"></a-entity>
        <a-entity light="type:point;color:#00C3E3;intensity:0.5;distance:14" position="-3 -2 2.5"></a-entity>

        <!-- Outer decorative ring -->
        <a-ring radius-inner="1.55" radius-outer="1.57" color="#E60012" position="0 0.1 -0.7" material="emissive:#E60012;emissiveIntensity:0.5;side:double;opacity:0.15;transparent:true" rotation="10 0 0" animation="property:rotation;from:10 0 0;to:10 0 360;dur:30000;loop:true;easing:linear"></a-ring>

        <!-- Inner glowing ring -->
        <a-ring radius-inner="1.2" radius-outer="1.24" color="#E60012" position="0 0.1 -0.4" material="emissive:#E60012;emissiveIntensity:0.8;side:double;opacity:0.3;transparent:true" animation="property:rotation;from:0 0 0;to:0 0 360;dur:16000;loop:true;easing:linear" animation__pulse="property:scale;from:0.88 0.88 0.88;to:1.12 1.12 1.12;dur:3500;dir:alternate;loop:true;easing:easeInOutSine"></a-ring>

        <!-- Cyan ring -->
        <a-ring radius-inner="1.38" radius-outer="1.4" color="#00C3E3" position="0 0.1 -0.55" rotation="18 8 0" material="emissive:#00C3E3;emissiveIntensity:0.5;side:double;opacity:0.15;transparent:true" animation="property:rotation;from:18 8 0;to:18 8 360;dur:24000;loop:true;easing:linear"></a-ring>

        <!-- Main product image -->
        <a-image id="mainProduct" src="#product1" width="2.7" height="1.515" position="0 0.1 0" material="transparent:true;alphaTest:0.01;opacity:1" animation="property:rotation;from:0 -7 0;to:0 7 0;dur:5000;easing:easeInOutSine;dir:alternate;loop:true" animation__float="property:position;from:0 -0.05 0;to:0 0.25 0;dur:3800;easing:easeInOutSine;dir:alternate;loop:true"></a-image>

        <!-- Red particles -->
        <a-sphere radius="0.03" position="1.5 0.9 -0.4" material="color:#E60012;emissive:#E60012;emissiveIntensity:1;transparent:true;opacity:0.85" animation="property:position;to:1.3 1.15 -0.2;dur:3800;dir:alternate;loop:true;easing:easeInOutSine" animation__s="property:scale;from:1 1 1;to:1.8 1.8 1.8;dur:2400;dir:alternate;loop:true"></a-sphere>
        <a-sphere radius="0.02" position="-1.2 -0.5 0.3" material="color:#E60012;emissive:#E60012;emissiveIntensity:1;transparent:true;opacity:0.6" animation="property:position;to:-0.9 -0.15 0.5;dur:5000;dir:alternate;loop:true;easing:easeInOutSine"></a-sphere>
        <a-sphere radius="0.025" position="0.8 1.3 -0.7" material="color:#FF4554;emissive:#FF4554;emissiveIntensity:0.9;transparent:true;opacity:0.7" animation="property:position;to:0.55 1.55 -0.5;dur:5800;dir:alternate;loop:true;easing:easeInOutSine"></a-sphere>
        <a-sphere radius="0.015" position="-0.6 1.1 0.15" material="color:#E60012;emissive:#E60012;emissiveIntensity:1;transparent:true;opacity:0.9" animation="property:position;to:-0.8 1.35 -0.05;dur:3400;dir:alternate;loop:true;easing:easeInOutSine" animation__s="property:scale;from:1 1 1;to:2.5 2.5 2.5;dur:2000;dir:alternate;loop:true"></a-sphere>
        <a-sphere radius="0.018" position="1.1 -0.9 -0.2" material="color:#E60012;emissive:#E60012;emissiveIntensity:1;transparent:true;opacity:0.5" animation="property:position;to:1.3 -0.6 0;dur:4500;dir:alternate;loop:true;easing:easeInOutSine"></a-sphere>

        <!-- Cyan particles -->
        <a-sphere radius="0.028" position="-1.5 0.55 -0.35" material="color:#00C3E3;emissive:#00C3E3;emissiveIntensity:1;transparent:true;opacity:0.7" animation="property:position;to:-1.25 0.85 -0.1;dur:4400;dir:alternate;loop:true;easing:easeInOutSine"></a-sphere>
        <a-sphere radius="0.035" position="1.25 -0.55 0.15" material="color:#00C3E3;emissive:#00C3E3;emissiveIntensity:0.8;transparent:true;opacity:0.5" animation="property:position;to:1.0 -0.25 0.35;dur:4200;dir:alternate;loop:true;easing:easeInOutSine"></a-sphere>
        <a-sphere radius="0.018" position="0.15 -1.1 0.35" material="color:#00C3E3;emissive:#00C3E3;emissiveIntensity:1;transparent:true;opacity:0.75" animation="property:position;to:0.35 -0.8 0.55;dur:3800;dir:alternate;loop:true;easing:easeInOutSine"></a-sphere>
        <a-sphere radius="0.012" position="-0.2 -0.7 0.6" material="color:#00C3E3;emissive:#00C3E3;emissiveIntensity:1;transparent:true;opacity:0.6" animation="property:position;to:-0.4 -0.45 0.7;dur:5200;dir:alternate;loop:true;easing:easeInOutSine" animation__s="property:scale;from:1 1 1;to:3 3 3;dur:2800;dir:alternate;loop:true"></a-sphere>

        <!-- Floating geometric shapes -->
        <a-box width="0.06" height="0.06" depth="0.06" position="-1.6 -0.85 -0.7" material="color:#E60012;emissive:#E60012;emissiveIntensity:0.5;transparent:true;opacity:0.45" animation="property:rotation;to:360 360 0;dur:7500;loop:true;easing:linear" animation__m="property:position;to:-1.35 -0.55 -0.5;dur:6000;dir:alternate;loop:true;easing:easeInOutSine"></a-box>
        <a-box width="0.045" height="0.045" depth="0.045" position="1.65 1.05 -0.55" material="color:#00C3E3;emissive:#00C3E3;emissiveIntensity:0.5;transparent:true;opacity:0.4" animation="property:rotation;to:0 360 360;dur:9500;loop:true;easing:linear" animation__m="property:position;to:1.45 1.3 -0.35;dur:5500;dir:alternate;loop:true;easing:easeInOutSine"></a-box>
        <a-box width="0.04" height="0.04" depth="0.04" position="0.3 1.5 -0.9" material="color:#FF4554;emissive:#FF4554;emissiveIntensity:0.4;transparent:true;opacity:0.35" animation="property:rotation;to:360 0 360;dur:11000;loop:true;easing:linear" animation__m="property:position;to:0.1 1.7 -0.7;dur:7000;dir:alternate;loop:true;easing:easeInOutSine"></a-box>

      </a-scene>
    </div>

    <div class="red-line-top"></div>
    <div class="red-line-bottom"></div>

    <!-- Product counter dots -->
    <div class="product-counter">
      <div class="dot active" id="dot0"></div>
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <div class="overlay">
      <div class="top-bar">
        <img class="logo-img" src="download-hd-nintendo-red-logo-png-701751694774116r0chk91ghq.png" alt="Nintendo">
      </div>
      <div class="tagline-container">
        <span class="tagline">Nouvelle Génération</span>
      </div>

      <div class="product-space"></div>

      <div class="bottom-content">
        <div class="headline">SWITCH <span class="accent">2</span></div>
        <div class="sub"><b>Jouez sans limites.</b><br>Partout. Tout le temps.</div>
        <div class="cta-wrapper">
          <button class="cta-button" id="ctaBtn">Découvrir</button>
        </div>
        <div class="hint">▸ Touchez pour explorer ◂</div>
      </div>
    </div>
  </div>

  <script>
    var products=[
      {id:'#product1',w:2.7,h:1.515},
      {id:'#product2',w:2.7,h:1.515},
      {id:'#product3',w:2.0,h:1.5},
      {id:'#product4',w:3.0,h:1.33}
    ];
    var currentIdx=0;
    var switching=false;

    function updateDots(){
      for(var i=0;i<products.length;i++){
        var d=document.getElementById('dot'+i);
        if(d){d.classList.toggle('active',i===currentIdx);}
      }
    }

    document.getElementById('ctaBtn').addEventListener('click',function(e){
      e.stopPropagation();
      window.open('https://www.nintendo.com/','_blank');
    });

    document.getElementById('ad-container').addEventListener('click',function(e){
      if(e.target.id==='ctaBtn')return;
      if(switching)return;
      switching=true;

      var mp=document.getElementById('mainProduct');
      mp.setAttribute('animation__out',{property:'scale',to:'0.85 0.85 0.85',dur:220,easing:'easeInQuad'});
      mp.setAttribute('animation__opout',{property:'material.opacity',to:0,dur:220,easing:'easeInQuad'});

      setTimeout(function(){
        currentIdx=(currentIdx+1)%products.length;
        var p=products[currentIdx];
        mp.setAttribute('src',p.id);
        mp.setAttribute('width',p.w);
        mp.setAttribute('height',p.h);
        mp.setAttribute('animation__in',{property:'scale',from:'1.15 1.15 1.15',to:'1 1 1',dur:320,easing:'easeOutBack'});
        mp.setAttribute('animation__opin',{property:'material.opacity',from:0,to:1,dur:320,easing:'easeOutQuad'});
        updateDots();
        setTimeout(function(){switching=false;},380);
      },250);
    });
  </script>
</body>
</html>
