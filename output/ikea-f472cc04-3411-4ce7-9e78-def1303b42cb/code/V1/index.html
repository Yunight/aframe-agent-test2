<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKEA – Buffets et Consoles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-970x250">
    <!-- Left: Brand Panel -->
    <div class="brand-panel">
      <img src="./ikea.svg" alt="logo" class="brand-logo">
      <div class="brand-copy">
        <p class="eyebrow">Nouvelle Collection</p>
        <h1 class="headline">Buffets <em>&amp;</em><br>Consoles</h1>
        <p class="subhead">Design scandinave<br>pour chaque intérieur</p>
      </div>
      <a class="cta-btn" href="https://www.ikea.com/fr/fr/cat/buffets-et-consoles-30454/">
        <span class="cta-label">Découvrir</span>
      </a>
    </div>

    <!-- Center: Hero Slideshow -->
    <div class="hero-panel">
      <div class="slideshow">
        <div class="slide active" data-index="0">
          <img src="./vihals-buffet-blanc__1048720_pe843879_s5.jpg" alt="VIHALS buffet blanc ambiance" class="slide-img">
          <div class="slide-badge">Ambiance</div>
        </div>
        <div class="slide" data-index="1">
          <img src="./besta-combinaison-rangement-tiroirs-brun-noir-lappviken-stubbarp-motif-noyer__1451119_pe990595_s5.jpg" alt="BESTA combinaison rangement" class="slide-img">
          <div class="slide-badge">BESTA</div>
        </div>
        <div class="slide" data-index="2">
          <img src="./vihals-buffet-blanc__1035578_pe838113_s5.jpg" alt="VIHALS buffet blanc" class="slide-img">
          <div class="slide-badge">VIHALS</div>
        </div>
      </div>
      <div class="slide-dots">
        <button class="dot active" data-dot="0" aria-label="Slide 1"></button>
        <button class="dot" data-dot="1" aria-label="Slide 2"></button>
        <button class="dot" data-dot="2" aria-label="Slide 3"></button>
      </div>
    </div>

    <!-- Right: Product Thumbnails -->
    <div class="thumb-panel">
      <p class="body-copy thumb-label">Nos produits</p>
      <div class="thumb-grid">
        <div class="thumb-card" data-target="0">
          <img src="./sideboards-buffets-10412.jpg" alt="Buffet chêne" class="thumb-img">
          <span class="thumb-name">Buffets</span>
        </div>
        <div class="thumb-card" data-target="1">
          <img src="./console-tables-16246.jpg" alt="Console blanche" class="thumb-img">
          <span class="thumb-name">Consoles</span>
        </div>
        <div class="thumb-card" data-target="2">
          <img src="./vihals-buffet-gris-fonce__1203691_pe906387_s5.jpg" alt="VIHALS gris foncé" class="thumb-img">
          <span class="thumb-name">VIHALS</span>
        </div>
      </div>
      <div class="promo-tag">
        <span class="promo-text">Jusqu'à <strong>-30%</strong></span>
      </div>
    </div>

    <!-- Footer strip -->
    <div class="ad-footer">
      <span>ikea.com/fr · Offre valable en magasin et en ligne</span>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
