<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea – Bubble Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Background decorative circles -->
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>

    <!-- Header: logo -->
    <header class="ad-header">
      <img src="./Kusmi_Tea_logo.png" alt="Kusmi Tea" class="logo">
      <span class="eyebrow">Nouveauté</span>
    </header>

    <!-- Product hero -->
    <div class="product-hero">
      <img
        src="./KITBBTEAPECHEPASSION-10FR_packshot.png"
        alt="Kit Bubble Tea Pêche Passion"
        class="product-img"
      >
    </div>

    <!-- Copy block -->
    <div class="copy-block">
      <h1 class="headline"><em>Bubble Tea</em> Maison</h1>
      <p class="subhead">Kit Pêche &amp; Passion</p>
      <p class="body-copy">Préparez votre bubble tea fruité bio chez vous&nbsp;!</p>
    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <a class="cta-btn" href="https://www.kusmitea.com/collections/bubble-tea" target="_blank" rel="noopener">
        <span class="cta-label">Découvrir le kit</span>
      </a>
    </div>

    <!-- Footer -->
    <footer class="ad-footer">
      <span>kusmi.tea &nbsp;|&nbsp; Made in France &nbsp;|&nbsp; Bio certifié</span>
    </footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
