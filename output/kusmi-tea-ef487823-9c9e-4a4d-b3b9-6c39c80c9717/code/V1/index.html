<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea – Bubble Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">
    <!-- Background bubbles -->
    <div class="bg-bubbles">
      <span class="bubble b1"></span>
      <span class="bubble b2"></span>
      <span class="bubble b3"></span>
      <span class="bubble b4"></span>
      <span class="bubble b5"></span>
      <span class="bubble b6"></span>
    </div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./Kusmi_Tea_logo.png" alt="Kusmi Tea" class="logo">
      <span class="badge">NOUVEAU</span>
    </header>

    <!-- Hero product image -->
    <div class="hero-wrap">
      <img src="./Capture_d_ecran_2026-04-15_093136.png" alt="Kusmi Tea Bubble Tea" class="hero-img">
      <div class="hero-overlay"></div>
    </div>

    <!-- Content -->
    <div class="ad-content">
      <p class="eyebrow">Collection Été</p>
      <h1 class="headline">Bubble Tea<br><em>Kusmi</em></h1>
      <p class="subline">Infusions bio &amp; perles de fruits<br>fabriquées en France</p>

      <!-- Carousel pills -->
      <div class="pills-track" id="pillsTrack">
        <div class="pill active" data-img="./Capture_d_ecran_2026-04-15_093136.png" data-label="La Gamme">La Gamme</div>
        <div class="pill" data-img="./MENU_vp_the_fr_ete_26.jpg" data-label="Thés &amp; Infusions">Thés &amp; Infusions</div>
        <div class="pill" data-img="./MENU_vp_coffret_fr_ete_26.jpg" data-label="Coffrets">Coffrets</div>
        <div class="pill" data-img="./MENU_vp_access_fr_ete_26.jpg" data-label="Accessoires">Accessoires</div>
      </div>

      <!-- CTA -->
      <a class="cta-btn" href="https://www.kusmitea.com/collections/bubble-tea" target="_blank">Découvrir la collection</a>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
