<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea – Bubble Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x600">
    <!-- Background bubbles -->
    <div class="bg-bubbles" aria-hidden="true">
      <span class="bubble b1"></span>
      <span class="bubble b2"></span>
      <span class="bubble b3"></span>
      <span class="bubble b4"></span>
      <span class="bubble b5"></span>
      <span class="bubble b6"></span>
      <span class="bubble b7"></span>
    </div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./Kusmi_Tea_logo.png" alt="Kusmi Tea" class="logo" width="95" height="31">
    </header>

    <!-- Hero product image (slides) -->
    <div class="hero-wrap">
      <div class="slide active" data-slide="0">
        <img src="./00-BUBBLETEA_26_BILLESLITCKUSMI450_POR_01.jpg" alt="Bubble Tea Kusmi" class="hero-img">
      </div>
      <div class="slide" data-slide="1">
        <img src="./KITBBTEAPECHEPASSION-10FR_packshot.png" alt="Kit Bubble Tea Pêche Passion" class="hero-img kit">
      </div>
      <div class="slide" data-slide="2">
        <img src="./b3746a4e4d761d3e8be9f8a6b79752d016c57976_SIROPPASSION25CL_lifestyle_principal_b2cweb.png" alt="Sirop Passion Monin" class="hero-img">
      </div>

      <!-- Dot nav -->
      <div class="dot-nav" role="tablist" aria-label="Visuels produits">
        <button class="dot active" data-idx="0" role="tab" aria-selected="true" aria-label="Visuel 1"></button>
        <button class="dot" data-idx="1" role="tab" aria-selected="false" aria-label="Visuel 2"></button>
        <button class="dot" data-idx="2" role="tab" aria-selected="false" aria-label="Visuel 3"></button>
      </div>

      <!-- Badge promo -->
      <div class="badge" aria-label="-10% de réduction">−10%</div>
    </div>

    <!-- Copy block -->
    <div class="copy-block">
      <p class="eyebrow">Nouveauté été</p>
      <h1 class="headline">Préparez votre<br><em>Bubble Tea</em></h1>
      <p class="subhead">Perles de fruits · Thé Bio · Sirop Monin</p>
      <p class="body-copy">Un rituel estival à savourer chez vous,<br>façon Kusmi.</p>
    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <a href="https://www.kusmitea.com/collections/bubble-tea" class="cta-btn" target="_blank" rel="noopener">
        Découvrir le kit
      </a>
    </div>

    <!-- Footer legal -->
    <footer class="ad-footer">
      <span>kusmi<strong>tea</strong>.com &nbsp;|&nbsp; Fait en France &nbsp;|&nbsp; Bio certifié</span>
    </footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
