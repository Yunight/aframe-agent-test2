<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea – Bubble Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Background decoration -->
    <div class="bg-layer"></div>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="./Kusmi_Tea_logo.png" alt="Kusmi Tea" class="logo">
    </div>

    <!-- Product hero -->
    <div class="product-hero">
      <img src="./KITBBTEAPECHEPASSION-10FR_packshot.png" alt="Kit Bubble Tea Pêche Passion" class="product-img">
    </div>

    <!-- Copy -->
    <div class="copy-block">
      <span class="eyebrow">Nouveauté</span>
      <h1 class="headline">Bubble Tea<br><em>Maison</em></h1>
      <p class="subhead">Kit Pêche &amp; Passion</p>
    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <a class="cta-btn" href="https://www.kusmitea.com/collections/bubble-tea" target="_blank" rel="noopener">
        <span class="cta-label">Découvrir le kit</span>
      </a>
      <p class="ad-footer"><span>kusmi.com · Offre limitée</span></p>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
