<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea – Bubble Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">
    <!-- Decorative bubbles (aria-hidden) -->
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./Kusmi_Tea_logo.png" alt="Kusmi Tea" class="ad-logo">
      <span class="eyebrow">Nouveauté</span>
    </header>

    <!-- Hero product image -->
    <div class="hero-wrap">
      <img
        src="./00-BUBBLETEA_26_BILLESLITCKUSMI450_POR_01.jpg"
        alt="Bubble Tea Kusmi Tea – lifestyle"
        class="hero-img"
        id="heroImg"
      >
      <div class="kit-badge">-10%</div>
    </div>

    <!-- Copy block -->
    <div class="copy-block">
      <p class="subhead">Préparez chez vous</p>
      <h1 class="headline"><em>Bubble Tea</em><br>Fait Maison</h1>
      <p class="body-copy">Kit complet · Perles de fruits · Sirop Monin</p>
    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <a class="cta-btn" href="https://www.kusmitea.com/collections/bubble-tea" target="_blank" rel="noopener">
        <span class="cta-label">Découvrir le kit</span>
      </a>
    </div>

    <!-- Footer -->
    <footer class="ad-footer">
      <span>kusmitea.com &nbsp;·&nbsp; Depuis 1867 &nbsp;·&nbsp; Bio &amp; Français</span>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
