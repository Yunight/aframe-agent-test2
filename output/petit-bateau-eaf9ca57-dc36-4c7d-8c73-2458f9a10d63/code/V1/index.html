<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petit Bateau – Collection Été Enfants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">
    <!-- Background decoration -->
    <div class="bg-waves"></div>
    <div class="sun-deco"></div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./logo-petit-bateau.svg" alt="logo" class="brand-logo">
    </header>

    <!-- Hero section -->
    <section class="hero-section">
      <div class="hero-badge">Nouveauté</div>
      <h1 class="hero-title">Plein<br><em>Été</em></h1>
      <p class="hero-sub">La collection ensoleillée pour enfants</p>
    </section>

    <!-- Product carousel -->
    <section class="carousel-section">
      <div class="carousel-track" id="carouselTrack">
        <div class="product-slide active" data-index="0">
          <div class="product-card">
            <img src="./MACARON_PLEIN_ETE_ensemble.jpg" alt="Ensemble été" class="product-img">
            <span class="product-label">Ensemble</span>
          </div>
        </div>
        <div class="product-slide" data-index="1">
          <div class="product-card">
            <img src="./MACARON_PLEIN_ETE_maillot.jpg" alt="Maillot été" class="product-img">
            <span class="product-label">Maillot</span>
          </div>
        </div>
        <div class="product-slide" data-index="2">
          <div class="product-card">
            <img src="./MACARON_PLEIN_ETE_robe.jpg" alt="Robe été" class="product-img">
            <span class="product-label">Robe</span>
          </div>
        </div>
        <div class="product-slide" data-index="3">
          <div class="product-card">
            <img src="./MACARON_PLEIN_ETE_short.jpg" alt="Short été" class="product-img">
            <span class="product-label">Short</span>
          </div>
        </div>
        <div class="product-slide" data-index="4">
          <div class="product-card">
            <img src="./MACARON_PLEIN_ETE_pyj.jpg" alt="Pyjama été" class="product-img">
            <span class="product-label">Pyjama</span>
          </div>
        </div>
      </div>

      <!-- Dot indicators -->
      <div class="carousel-dots" id="carouselDots">
        <button class="dot active" data-dot="0" aria-label="Produit 1"></button>
        <button class="dot" data-dot="1" aria-label="Produit 2"></button>
        <button class="dot" data-dot="2" aria-label="Produit 3"></button>
        <button class="dot" data-dot="3" aria-label="Produit 4"></button>
        <button class="dot" data-dot="4" aria-label="Produit 5"></button>
      </div>

      <!-- Prev / Next arrows -->
      <button class="carousel-arrow arrow-left" id="arrowLeft" aria-label="Précédent">&#8249;</button>
      <button class="carousel-arrow arrow-right" id="arrowRight" aria-label="Suivant">&#8250;</button>
    </section>

    <!-- Tagline -->
    <p class="tagline">Liberté · Qualité · Durabilité</p>

    <!-- CTA -->
    <a class="cta-btn" href="https://www.petit-bateau.fr/collection/collection-ete/" target="_blank" rel="noopener">
      Découvrir la collection
    </a>

    <!-- Floating decorative stripes -->
    <div class="stripe-deco stripe-1"></div>
    <div class="stripe-deco stripe-2"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
