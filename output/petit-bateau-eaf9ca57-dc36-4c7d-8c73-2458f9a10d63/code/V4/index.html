<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petit Bateau – Collection Été Enfants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Background decoration -->
    <div class="bg-waves"></div>
    <div class="sun-deco"></div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./logo-petit-bateau.svg" alt="Petit Bateau" class="logo">
      <span class="badge">Été 2026</span>
    </header>

    <!-- Headline -->
    <div class="headline-block">
      <h1 class="headline">Plein Été</h1>
      <p class="subhead">Collection Enfants</p>
    </div>

    <!-- Product carousel -->
    <div class="carousel-wrap">
      <div class="carousel" id="carousel">
        <div class="slide active" data-index="0">
          <img src="./MACARON_PLEIN_ETE_ensemble.jpg" alt="Ensemble été" class="product-img">
        </div>
        <div class="slide" data-index="1">
          <img src="./MACARON_PLEIN_ETE_maillot.jpg" alt="Maillot été" class="product-img">
        </div>
        <div class="slide" data-index="2">
          <img src="./MACARON_PLEIN_ETE_robe.jpg" alt="Robe été" class="product-img">
        </div>
        <div class="slide" data-index="3">
          <img src="./MACARON_PLEIN_ETE_short.jpg" alt="Short été" class="product-img">
        </div>
        <div class="slide" data-index="4">
          <img src="./MACARON_PLEIN_ETE_pyj.jpg" alt="Pyjama été" class="product-img">
        </div>
      </div>
      <!-- Dots -->
      <div class="dots" id="dots">
        <span class="dot active" data-dot="0"></span>
        <span class="dot" data-dot="1"></span>
        <span class="dot" data-dot="2"></span>
        <span class="dot" data-dot="3"></span>
        <span class="dot" data-dot="4"></span>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-block">
      <a class="cta-btn" href="https://www.petit-bateau.fr/collection/collection-ete/" target="_blank">Découvrir la collection</a>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
