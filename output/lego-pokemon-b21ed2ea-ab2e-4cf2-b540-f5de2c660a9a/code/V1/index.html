<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO® Pokémon™ 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <!-- Header -->
    <header class="ad-header">
      <img src="./brand-lego.svg" alt="logo" class="ad-logo">
      <span class="eyebrow">× Pokémon™</span>
    </header>

    <!-- Carousel -->
    <div class="carousel-wrapper" id="carouselWrapper">
      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-slide">
          <img src="./blt99fc181f1298c1d6-72156_Prod_en-gb.jpg" alt="LEGO Pokémon Squirtle" class="slide-img">
        </div>
        <div class="carousel-slide">
          <img src="./40892_Prod.jpg" alt="LEGO Pokémon Badge Collection" class="slide-img">
        </div>
        <div class="carousel-slide">
          <img src="./blt91ca18fede88b80f-76340_Prod_en-gb.jpg" alt="LEGO Super Heroes" class="slide-img">
        </div>
        <div class="carousel-slide">
          <img src="./blt691e598d84db744d-75456_Prod_en-gb.jpg" alt="LEGO Star Wars" class="slide-img">
        </div>
        <div class="carousel-slide">
          <img src="./blt4040f2bc95e1380d-43032_Prod_en-gb.jpg" alt="LEGO FIFA Trophy" class="slide-img">
        </div>
      </div>
      <div class="badge-pill">NOUVEAU 2026</div>
    </div>

    <!-- Copy block -->
    <div class="copy-block">
      <p class="subhead">Collection officielle</p>
      <h1 class="headline">Construis ton<br><em>aventure Pokémon</em></h1>
      <p class="body-copy">Célèbre 30 ans de Pokémon brique par brique !</p>
    </div>

    <!-- CTA -->
    <div class="cta-area">
      <a class="cta-btn" href="https://www.lego.com/fr-fr/themes/pokemon">
        <span class="cta-label">Découvrir la collection</span>
      </a>
    </div>

    <!-- Footer -->
    <footer class="ad-footer">
      <span>© 2026 The LEGO Group. Pokémon™ &amp; © Nintendo / Creatures / GAME FREAK</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
