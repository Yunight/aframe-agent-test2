<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea – Vente Privilège KusmiKlub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <!-- Header -->
    <header class="ad-header">
      <img src="./Kusmi_Tea_logo.png" alt="Kusmi Tea" class="ad-logo">
      <span class="eyebrow">KusmiKlub</span>
    </header>

    <!-- Hero text -->
    <div class="ad-hero-text">
      <p class="subhead">Offre exclusive membres</p>
      <h1 class="headline">Vente<br><em>Privilège</em></h1>
      <p class="discount-badge">Jusqu'à <strong>-50%</strong></p>
    </div>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow" aria-label="Galerie produits">
      <div class="slide active">
        <img src="./lot.png" alt="Collection Rituels Kusmi Tea" class="slide-img">
      </div>
      <div class="slide">
        <img src="./GMS_26_INGC20SBIO_INVC20SBIO_INPA20SBIO_INCC20SBIO_UNI_02_057c8caa-f192-412e-b9e6-ab27d7239f83.jpg" alt="Boîtes botaniques Kusmi Tea" class="slide-img">
      </div>
      <div class="slide">
        <img src="./Capture_d_ecran_2026-04-15_093136.png" alt="Sélection de thés Kusmi Tea" class="slide-img">
      </div>
      <div class="slide">
        <img src="./rituel_minceur.png" alt="Rituel Minceur Kusmi Tea" class="slide-img">
      </div>
      <div class="slide">
        <img src="./RITUELDRAINANT_25_LIFESTYLE_DRAI100BIO_DRAI18SBIO_POR_04_1.jpg" alt="Rituel Drainant Kusmi Tea" class="slide-img">
      </div>
      <div class="slide">
        <img src="./sommeil_glace.jpg" alt="Sommeil Glacé Kusmi Tea" class="slide-img">
      </div>
      <!-- Dots -->
      <div class="slide-dots" id="slideDots"></div>
    </div>

    <!-- Footer CTA -->
    <footer class="ad-footer">
      <span class="body-copy">Réservé aux membres KusmiKlub</span>
      <a class="cta-btn" href="https://www.kusmitea.com/collections/vente-privilege"><span class="cta-label">J'en profite</span></a>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
