<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320,initial-scale=1">
  <title>Fortnite - Été 2026</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:320px;height:480px;overflow:hidden;background:#080818;}
    .ad-wrapper{width:320px;height:480px;position:relative;overflow:hidden;}
    .overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;}
    .top-bar{text-align:center;padding:10px 16px 0;background:linear-gradient(to bottom,rgba(8,8,24,0.95) 0%,rgba(8,8,24,0.4) 60%,transparent 100%);padding-bottom:35px;}
    .logo-img{width:145px;height:auto;mix-blend-mode:screen;filter:drop-shadow(0 0 14px rgba(27,144,221,0.5));}
    .bottom-bar{text-align:center;padding:45px 16px 14px;background:linear-gradient(to top,rgba(8,8,24,0.98) 0%,rgba(8,8,24,0.85) 55%,transparent 100%);pointer-events:auto;}
    .season-badge{display:inline-block;background:rgba(27,144,221,0.15);border:1px solid rgba(95,206,234,0.4);border-radius:20px;padding:4px 14px;font-family:'Noto Sans',sans-serif;font-weight:700;color:#5FCEEA;font-size:9px;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px;animation:badge-glow 3s ease-in-out infinite;}
    .main-heading{font-family:'Noto Sans',sans-serif;font-weight:900;color:#FFF;font-size:24px;text-transform:uppercase;letter-spacing:1px;line-height:1.1;margin-bottom:5px;text-shadow:0 0 25px rgba(27,144,221,0.4),0 2px 8px rgba(0,0,0,0.9);}
    .sub-text{font-family:'Noto Sans',sans-serif;font-weight:400;color:rgba(255,255,255,0.6);font-size:11px;margin-bottom:14px;}
    .cta-btn{background:linear-gradient(135deg,#F3AF19,#f5c842,#F3AF19);background-size:200% 100%;color:#000;border:none;padding:12px 42px;font-family:'Noto Sans',sans-serif;font-weight:900;font-size:14px;text-transform:uppercase;cursor:pointer;border-radius:6px;letter-spacing:2px;animation:cta-pulse 2s ease-in-out infinite;box-shadow:0 4px 25px rgba(243,175,25,0.45);pointer-events:auto;}
    .cta-btn:hover{transform:scale(1.1)!important;}
    .hint{font-family:'Noto Sans',sans-serif;color:rgba(255,255,255,0.3);font-size:8px;margin-top:8px;letter-spacing:1px;}
    @keyframes cta-pulse{0%,100%{transform:scale(1);box-shadow:0 4px 25px rgba(243,175,25,0.4);}50%{transform:scale(1.05);box-shadow:0 6px 35px rgba(243,175,25,0.7);}}
    @keyframes badge-glow{0%,100%{border-color:rgba(95,206,234,0.4);box-shadow:0 0 8px rgba(95,206,234,0.1);}50%{border-color:rgba(95,206,234,0.8);box-shadow:0 0 16px rgba(95,206,234,0.3);}}
  </style>
  <script>
    AFRAME.registerComponent('hover-scale',{schema:{to:{type:'string',default:'1.8 1.8 1.8'}},init:function(){var el=this.el;var to=this.data.to;el.addEventListener('mouseenter',function(){el.setAttribute('animation__hscale',{property:'scale',to:to,dur:250,easing:'easeOutElastic'});});el.addEventListener('mouseleave',function(){el.setAttribute('animation__hscale',{property:'scale',to:'1 1 1',dur:250,easing:'easeOutQuad'});});el.addEventListener('click',function(){el.setAttribute('animation__burst',{property:'scale',from:'2.5 2.5 2.5',to:'1 1 1',dur:600,easing:'easeOutElastic'});});}})
  </script>
</head>
<body>
  <div class="ad-wrapper">
    <div class="overlay">
      <div class="top-bar">
        <img class="logo-img" src="15b291f9f4a691b3c6fe31ab7a3a0cd2.jpg" alt="Fortnite">
      </div>
      <div class="bottom-bar">
        <div class="season-badge">Chapitre 7 · Saison 3</div>
        <div class="main-heading">L'été sera<br>épique</div>
        <div class="sub-text">Nouvelle saison · 5 juin 2026</div>
        <button class="cta-btn" onclick="window.open('https://www.fortnite.com','_blank')">Jouer Gratuit</button>
        <div class="hint">▸ Survolez les éléments 3D ◂</div>
      </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true;colorManagement:true;sortObjects:true" loading-screen="enabled:false">
      <a-assets>
        <img id="art1" src="4667286-fortnitec7s2keyartwords.jpg">
        <img id="art2" src="fortnite-characters-running-towards-shadow-boss-in-live-event.jpg">
      </a-assets>

      <a-sky color="#080818"></a-sky>

      <a-entity camera position="0 0 5" look-controls="enabled:false">
        <a-entity cursor="fuse:false;rayOrigin:mouse" raycaster="objects:.interactive"></a-entity>
      </a-entity>

      <a-light type="ambient" color="#1a1a3a" intensity="0.5"></a-light>
      <a-light type="point" color="#1B90DD" position="4 4 4" intensity="2.5"></a-light>
      <a-light type="point" color="#9D4DBB" position="-4 -3 3" intensity="2"></a-light>
      <a-light type="point" color="#F3AF19" position="0 -3 5" intensity="0.6"></a-light>

      <!-- Background art layer -->
      <a-plane src="#art2" width="6" height="3.38" position="0 0.3 -3.5" material="shader:flat;opacity:0.15"></a-plane>

      <!-- Portal rings -->
      <a-torus position="0 0.3 -0.8" radius="2.4" radius-tubular="0.04" material="color:#1B90DD;shader:flat;opacity:0.45" animation="property:rotation;to:0 0 360;dur:12000;easing:linear;loop:true"></a-torus>
      <a-torus position="0 0.3 -1" radius="2.2" radius-tubular="0.03" material="color:#5FCEEA;shader:flat;opacity:0.3" animation="property:rotation;to:360 0 0;dur:16000;easing:linear;loop:true"></a-torus>
      <a-torus position="0 0.3 -0.6" radius="2.6" radius-tubular="0.025" material="color:#9D4DBB;shader:flat;opacity:0.2" animation="property:rotation;to:0 360 0;dur:20000;easing:linear;loop:true"></a-torus>

      <!-- Main product card with gentle oscillation -->
      <a-entity position="0 0.3 0" animation="property:rotation;from:0 -12 1;to:0 12 -1;dur:5000;dir:alternate;easing:easeInOutSine;loop:true">
        <a-plane class="interactive" src="#art1" width="3.3" height="1.86" position="0 0 0" material="shader:flat;side:double" hover-scale="to:1.06 1.06 1.06"></a-plane>
        <a-box width="3.36" height="1.92" depth="0.06" position="0 0 -0.04" material="color:#1B90DD;metalness:0.8;roughness:0.3;opacity:0.5"></a-box>
      </a-entity>

      <!-- Floating particles with interaction -->
      <a-box class="interactive" width="0.14" height="0.14" depth="0.14" position="2.1 1.6 -0.4" material="color:#F3AF19;shader:flat" hover-scale animation="property:position;from:2.1 1.3 -0.4;to:2.1 1.8 -0.4;dur:2200;dir:alternate;easing:easeInOutSine;loop:true" animation__rot="property:rotation;to:360 360 0;dur:4000;easing:linear;loop:true"></a-box>

      <a-sphere class="interactive" radius="0.09" position="-1.7 1.5 -0.2" material="color:#5FCEEA;shader:flat" hover-scale animation="property:position;from:-1.7 1.2 -0.2;to:-1.7 1.7 -0.2;dur:2800;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>

      <a-dodecahedron class="interactive" radius="0.11" position="1.9 -0.9 -0.3" material="color:#9D4DBB;shader:flat" hover-scale animation="property:position;from:1.9 -1.1 -0.3;to:1.9 -0.7 -0.3;dur:2400;dir:alternate;easing:easeInOutSine;loop:true" animation__rot="property:rotation;to:360 0 360;dur:6000;easing:linear;loop:true"></a-dodecahedron>

      <a-box class="interactive" width="0.1" height="0.1" depth="0.1" position="-1.5 -1.3 0.3" material="color:#F3AF19;shader:flat;opacity:0.85" hover-scale animation="property:position;from:-1.5 -1.5 0.3;to:-1.5 -1.1 0.3;dur:2000;dir:alternate;easing:easeInOutSine;loop:true" animation__rot="property:rotation;to:0 360 360;dur:5000;easing:linear;loop:true"></a-box>

      <a-octahedron class="interactive" radius="0.08" position="-2.1 0.2 -0.5" material="color:#4C51F7;shader:flat;opacity:0.75" hover-scale animation__rot="property:rotation;to:0 360 0;dur:4000;easing:linear;loop:true" animation="property:position;from:-2.1 0 -0.5;to:-2.1 0.4 -0.5;dur:1900;dir:alternate;easing:easeInOutSine;loop:true"></a-octahedron>

      <a-sphere class="interactive" radius="0.06" position="1.2 -1.9 0.1" material="color:#1B90DD;shader:flat;opacity:0.7" hover-scale animation="property:position;from:1.2 -2.1 0.1;to:1.2 -1.7 0.1;dur:1700;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>

      <a-box class="interactive" width="0.08" height="0.08" depth="0.08" position="0.7 2.3 -1.2" material="color:#319236;shader:flat;opacity:0.6" hover-scale animation__rot="property:rotation;to:360 360 360;dur:7000;easing:linear;loop:true" animation="property:position;from:0.7 2.1 -1.2;to:0.7 2.5 -1.2;dur:3000;dir:alternate;easing:easeInOutSine;loop:true"></a-box>

      <a-tetrahedron class="interactive" radius="0.09" position="-0.5 2.1 -0.8" material="color:#5FCEEA;shader:flat;opacity:0.6" hover-scale animation__rot="property:rotation;to:360 180 0;dur:5500;easing:linear;loop:true" animation="property:position;from:-0.5 1.9 -0.8;to:-0.5 2.3 -0.8;dur:2600;dir:alternate;easing:easeInOutSine;loop:true"></a-tetrahedron>

      <a-box class="interactive" width="0.07" height="0.07" depth="0.07" position="2.4 -1.6 -1" material="color:#9D4DBB;shader:flat;opacity:0.55" hover-scale animation__rot="property:rotation;to:0 0 360;dur:3500;easing:linear;loop:true" animation="property:position;from:2.4 -1.8 -1;to:2.4 -1.4 -1;dur:2100;dir:alternate;easing:easeInOutSine;loop:true"></a-box>

      <!-- Tiny white star specs -->
      <a-sphere radius="0.025" position="0.5 2.8 -2" material="color:#FFF;shader:flat;opacity:0.4" animation="property:position;from:0.5 2.6 -2;to:0.5 3 -2;dur:2000;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>
      <a-sphere radius="0.02" position="-0.9 -2.6 -1.5" material="color:#FFF;shader:flat;opacity:0.3" animation="property:position;from:-0.9 -2.8 -1.5;to:-0.9 -2.4 -1.5;dur:2500;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>
      <a-sphere radius="0.03" position="2.6 -0.3 -2" material="color:#5FCEEA;shader:flat;opacity:0.2" animation="property:position;from:2.6 -0.5 -2;to:2.6 -0.1 -2;dur:1800;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>
      <a-sphere radius="0.02" position="-2.4 2.1 -1.8" material="color:#F3AF19;shader:flat;opacity:0.25" animation="property:position;from:-2.4 1.9 -1.8;to:-2.4 2.3 -1.8;dur:2300;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>
      <a-sphere radius="0.015" position="1.8 2.5 -2.2" material="color:#FFF;shader:flat;opacity:0.35" animation="property:position;from:1.8 2.3 -2.2;to:1.8 2.7 -2.2;dur:1600;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>
      <a-sphere radius="0.018" position="-1.3 -2.1 -1.8" material="color:#9D4DBB;shader:flat;opacity:0.2" animation="property:position;from:-1.3 -2.3 -1.8;to:-1.3 -1.9 -1.8;dur:2700;dir:alternate;easing:easeInOutSine;loop:true"></a-sphere>

    </a-scene>
  </div>
</body>
</html>
