<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nike Nouveautés – 320×480</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">
    <!-- Background accent -->
    <div class="bg-accent"></div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./langfr-250px-Logo_NIKE.svg.png" alt="Nike" class="nike-logo">
      <span class="badge">NOUVEAUTÉS</span>
    </header>

    <!-- Headline -->
    <div class="headline-block">
      <p class="eyebrow">Vient d'arriver</p>
      <h1 class="headline">TOUT&nbsp;NOUVEAU,<br>TOUT&nbsp;NIKE</h1>
    </div>

    <!-- Product carousel -->
    <div class="carousel-wrapper">
      <div class="carousel" id="carousel">
        <div class="slide active" data-index="0">
          <img src="./NIKE_MIND_001.jpg" alt="Nike Mind 001" class="product-img">
        </div>
        <div class="slide" data-index="1">
          <img src="./W_NIKE_MIND_001.jpg" alt="Nike Mind 001 Femme" class="product-img">
        </div>
        <div class="slide" data-index="2">
          <img src="./W_NK_STDO_FLC_MW_MR_STD_4_SHRT.jpg" alt="Tenue Studio Femme" class="product-img">
        </div>
        <div class="slide" data-index="3">
          <img src="./W_NK_STDO_FLC_MW_MR_STD_OH_PNT.jpg" alt="Coupe-vent Studio Femme" class="product-img">
        </div>
        <div class="slide" data-index="4">
          <img src="./W_NK_STDO_FLC_MW_STD_FZ_HDY.jpg" alt="Hoodie Studio Femme" class="product-img">
        </div>
      </div>

      <!-- Prev / Next -->
      <button class="nav-btn prev" id="prevBtn" aria-label="Précédent">&#8249;</button>
      <button class="nav-btn next" id="nextBtn" aria-label="Suivant">&#8250;</button>

      <!-- Dot indicators -->
      <div class="dots" id="dots">
        <span class="dot active" data-dot="0"></span>
        <span class="dot" data-dot="1"></span>
        <span class="dot" data-dot="2"></span>
        <span class="dot" data-dot="3"></span>
        <span class="dot" data-dot="4"></span>
      </div>
    </div>

    <!-- Product label -->
    <p class="product-label" id="productLabel">Nike Mind 001</p>

    <!-- CTA -->
    <div class="cta-block">
      <a href="https://www.nike.com/fr/w/nouveau-3n82y" class="cta-btn" target="_blank" rel="noopener">Découvrir la collection</a>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
