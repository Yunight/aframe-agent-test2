<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <title>Toy Story 5 - Le Jouet Contre la Tech</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 320px;
      height: 480px;
      overflow: hidden;
      background: #004190;
    }
    .ad {
      position: relative;
      width: 320px;
      height: 480px;
      overflow: hidden;
      touch-action: none;
    }
    .scene-wrap {
      position: absolute;
      top: 0; left: 0;
      width: 320px;
      height: 480px;
    }
    .vignette {
      position: absolute;
      top: 0; left: 0;
      width: 320px;
      height: 480px;
      z-index: 3;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,65,144,0.6) 100%);
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 320px;
      height: 480px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: 'Gill Sans', sans-serif;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    /* ===== TOP: Title ===== */
    .top {
      text-align: center;
      padding-top: 18px;
      width: 100%;
    }
    .brand {
      font-size: 11px;
      font-weight: 300;
      color: #E0E0E0;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeSlideDown 0.6s ease-out 0.3s forwards;
    }
    .title-wrap {
      opacity: 0;
      animation: scaleIn 0.8s ease-out 0.5s forwards;
    }
    .t-toy {
      font-size: 56px;
      font-weight: 800;
      color: #FFEE15;
      line-height: 0.9;
      letter-spacing: 0.06em;
      text-shadow:
        3px 3px 0 #1A48A0,
        -1px -1px 0 #1A48A0,
        1px -1px 0 #1A48A0,
        -1px 1px 0 #1A48A0,
        1px 1px 0 #1A48A0,
        0 4px 14px rgba(18,18,18,0.5);
    }
    .t-story-row {
      margin-top: 3px;
    }
    .t-story {
      display: inline-block;
      background: #F1060B;
      color: #FFEE15;
      font-size: 32px;
      font-weight: 800;
      padding: 2px 20px 5px;
      line-height: 1.1;
      letter-spacing: 0.05em;
      border-radius: 4px;
      text-shadow: 0 2px 4px rgba(18,18,18,0.3);
      box-shadow: 0 3px 12px rgba(241,6,11,0.45);
    }
    .t-five {
      font-size: 70px;
      font-weight: 800;
      color: #FFEE15;
      line-height: 0.92;
      margin-top: -2px;
      text-shadow:
        3px 3px 0 #1A48A0,
        -1px -1px 0 #1A48A0,
        1px -1px 0 #1A48A0,
        -1px 1px 0 #1A48A0,
        1px 1px 0 #1A48A0,
        0 4px 14px rgba(18,18,18,0.5);
      animation: glow5 3s ease-in-out infinite 1.5s;
    }

    /* ===== MIDDLE: Tagline ===== */
    .mid {
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease-out 1.2s forwards;
    }
    .tagline {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(18,18,18,0.6);
      background: rgba(26,72,160,0.45);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,238,21,0.2);
    }

    /* ===== BOTTOM: CTA ===== */
    .bot {
      width: 100%;
      text-align: center;
      padding-bottom: 14px;
      opacity: 0;
      animation: fadeSlideUp 0.8s ease-out 1.5s forwards;
    }
    .sub {
      font-size: 13px;
      font-weight: 400;
      color: #E0E0E0;
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .date {
      font-size: 16px;
      font-weight: 600;
      color: #FFEE15;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      text-shadow: 0 2px 8px rgba(18,18,18,0.35);
    }
    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #F1060B 0%, #AD251B 100%);
      color: #FFFFFF;
      font-family: 'Gill Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 42px;
      border: 2px solid rgba(255,238,21,0.35);
      border-radius: 30px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(241,6,11,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulseCta 2.5s ease-in-out infinite;
    }
    .cta:hover, .cta:active {
      transform: scale(1.06);
      box-shadow: 0 6px 30px rgba(241,6,11,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .hint {
      font-size: 10px;
      font-weight: 300;
      color: #E0E0E0;
      margin-top: 10px;
      opacity: 0;
      animation: fadeIn 1s ease-out 2.5s forwards;
    }
    .hint span {
      display: inline-block;
      animation: blink 2.5s ease-in-out infinite;
    }
    .legal {
      font-size: 8px;
      font-weight: 300;
      color: #E0E0E0;
      margin-top: 4px;
      opacity: 0.45;
      letter-spacing: 0.02em;
    }

    /* ===== Keyframes ===== */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulseCta {
      0%, 100% {
        box-shadow: 0 4px 20px rgba(241,6,11,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
      }
      50% {
        box-shadow: 0 4px 30px rgba(241,6,11,0.8), 0 0 40px rgba(255,238,21,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
      }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 0.2; }
    }
    @keyframes glow5 {
      0%, 100% {
        text-shadow: 3px 3px 0 #1A48A0, -1px -1px 0 #1A48A0, 1px -1px 0 #1A48A0, -1px 1px 0 #1A48A0, 1px 1px 0 #1A48A0, 0 4px 14px rgba(18,18,18,0.5);
      }
      50% {
        text-shadow: 3px 3px 0 #1A48A0, -1px -1px 0 #1A48A0, 1px -1px 0 #1A48A0, -1px 1px 0 #1A48A0, 1px 1px 0 #1A48A0, 0 4px 14px rgba(18,18,18,0.5), 0 0 30px rgba(255,238,21,0.6), 0 0 60px rgba(255,238,21,0.25);
      }
    }
  </style>
</head>
<body>
<div class="ad" id="ad">

  <!-- ===== A-FRAME 3D SCENE ===== -->
  <div class="scene-wrap">
    <a-scene embedded
             vr-mode-ui="enabled: false"
             renderer="antialias: true; alpha: false; colorManagement: true"
             loading-screen="enabled: false">

      <a-entity camera="fov: 60" position="0 0 4"
                look-controls="enabled: false"
                wasd-controls="enabled: false"></a-entity>

      <a-sky color="#004190"></a-sky>

      <!-- Lighting -->
      <a-entity light="type: ambient; color: #3170A9; intensity: 0.55"></a-entity>
      <a-entity light="type: point; color: #FFEE15; intensity: 0.7; distance: 20" position="0 4 3"></a-entity>
      <a-entity light="type: point; color: #F1060B; intensity: 0.35; distance: 15" position="-3 -2 2"></a-entity>
      <a-entity light="type: point; color: #3170A9; intensity: 0.25; distance: 15" position="3 2 1"></a-entity>
      <a-entity light="type: directional; color: #FFFFFF; intensity: 0.6" position="1 3 4"></a-entity>

      <!-- ===== FLOATING TOY SHAPES ===== -->

      <!-- Yellow cube top-left -->
      <a-box class="toy" position="-1.4 2.0 0" width="0.5" height="0.5" depth="0.5"
             color="#FFEE15" material="roughness: 0.55; metalness: 0.1"
             animation="property: rotation; from: 15 0 -10; to: 375 360 -10; dur: 8000; loop: true; easing: linear"
             animation__bob="property: position; from: -1.4 2.0 0; to: -1.4 2.5 0; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine"
             animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 200"></a-box>

      <!-- Red sphere right-mid -->
      <a-sphere class="toy" position="1.6 0.8 0.5" radius="0.35"
               color="#F1060B" material="roughness: 0.4; metalness: 0.15"
               animation__bob="property: position; from: 1.6 0.8 0.5; to: 1.6 1.35 0.5; dur: 3500; dir: alternate; loop: true; easing: easeInOutSine"
               animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 400"></a-sphere>

      <!-- Purple cylinder left-mid -->
      <a-cylinder class="toy" position="-1.8 -0.3 -0.5" radius="0.22" height="0.6"
                  color="#87539B" material="roughness: 0.5; metalness: 0.1"
                  animation="property: rotation; from: 20 0 15; to: 20 360 15; dur: 7000; loop: true; easing: linear"
                  animation__bob="property: position; from: -1.8 -0.3 -0.5; to: -1.8 0.15 -0.5; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine"
                  animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 600"></a-cylinder>

      <!-- Green box bottom-right -->
      <a-box class="toy" position="1.3 -1.8 0" width="0.4" height="0.4" depth="0.4"
             color="#68BD56" material="roughness: 0.5; metalness: 0.1"
             animation="property: rotation; from: 0 0 -15; to: 360 360 -15; dur: 6000; loop: true; easing: linear"
             animation__bob="property: position; from: 1.3 -1.8 0; to: 1.3 -1.35 0; dur: 2800; dir: alternate; loop: true; easing: easeInOutSine"
             animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 800"></a-box>

      <!-- Orange cone top-right -->
      <a-cone class="toy" position="1.2 2.3 -0.5" radius-bottom="0.28" height="0.55"
              color="#F7C026" material="roughness: 0.5; metalness: 0.1"
              animation="property: rotation; from: 10 0 -5; to: 10 360 -5; dur: 6500; loop: true; easing: linear"
              animation__bob="property: position; from: 1.2 2.3 -0.5; to: 1.2 2.75 -0.5; dur: 3200; dir: alternate; loop: true; easing: easeInOutSine"
              animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 500"></a-cone>

      <!-- Blue torus center-back -->
      <a-torus class="toy" position="0 0.3 -2" radius="0.5" radius-tubular="0.1"
               color="#3170A9" material="roughness: 0.4; metalness: 0.2"
               animation="property: rotation; from: 0 0 0; to: 360 360 0; dur: 12000; loop: true; easing: linear"
               animation__bob="property: position; from: 0 0.3 -2; to: 0 0.8 -2; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine"
               animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 350"></a-torus>

      <!-- Brown box bottom-left -->
      <a-box class="toy" position="-1.1 -2.0 0.5" width="0.35" height="0.35" depth="0.35"
             color="#864F34" material="roughness: 0.7; metalness: 0.05"
             animation="property: rotation; from: -10 0 20; to: 350 360 20; dur: 9000; loop: true; easing: linear"
             animation__bob="property: position; from: -1.1 -2.0 0.5; to: -1.1 -1.6 0.5; dur: 3800; dir: alternate; loop: true; easing: easeInOutSine"
             animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 700"></a-box>

      <!-- White sphere accent -->
      <a-sphere class="toy" position="-0.7 1.4 1" radius="0.15"
               color="#FFFFFF" material="roughness: 0.3; metalness: 0.1"
               animation__bob="property: position; from: -0.7 1.4 1; to: -0.7 1.8 1; dur: 2400; dir: alternate; loop: true; easing: easeInOutSine"
               animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; easing: easeOutBack; delay: 350"></a-sphere>

      <!-- ===== TABLET (Lilypad) ===== -->
      <a-entity id="tablet" position="0 -0.2 1"
                animation__sway="property: rotation; from: 0 -8 5; to: 0 8 -5; dur: 4500; dir: alternate; loop: true; easing: easeInOutSine"
                animation__float="property: position; from: 0 -0.2 1; to: 0 0.15 1; dur: 3500; dir: alternate; loop: true; easing: easeInOutSine"
                animation__enter="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; easing: easeOutBack; delay: 100">
        <a-box width="1.1" height="0.75" depth="0.06" color="#121212"
               material="metalness: 0.7; roughness: 0.3"></a-box>
        <a-plane id="tabletScreen" width="0.96" height="0.62" position="0 0 0.035"
                 material="color: #1A48A0; emissive: #3170A9; emissiveIntensity: 0.4; opacity: 0.95"></a-plane>
        <a-plane width="0.96" height="0.62" position="0 0 0.04"
                 material="color: #87539B; emissive: #87539B; emissiveIntensity: 0.6; transparent: true; opacity: 0.2"
                 animation="property: material.opacity; from: 0.2; to: 0.05; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>
      </a-entity>

      <!-- ===== SPARKLE STARS ===== -->
      <a-sphere position="-1.9 1.2 -1" radius="0.06"
                material="color: #FFEE15; emissive: #FFEE15; emissiveIntensity: 0.8"
                animation="property: scale; from: 0.5 0.5 0.5; to: 1.5 1.5 1.5; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"></a-sphere>
      <a-sphere position="2.0 2.0 -1.5" radius="0.05"
                material="color: #FFEE15; emissive: #FFEE15; emissiveIntensity: 0.8"
                animation="property: scale; from: 0.5 0.5 0.5; to: 1.8 1.8 1.8; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine; delay: 400"></a-sphere>
      <a-sphere position="0.5 -2.5 -1" radius="0.04"
                material="color: #FFEE15; emissive: #FFEE15; emissiveIntensity: 0.8"
                animation="property: scale; from: 0.5 0.5 0.5; to: 2 2 2; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine; delay: 800"></a-sphere>
      <a-sphere position="-0.5 -1.3 -0.5" radius="0.05"
                material="color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.6"
                animation="property: scale; from: 0.3 0.3 0.3; to: 1.5 1.5 1.5; dur: 1600; dir: alternate; loop: true; easing: easeInOutSine; delay: 600"></a-sphere>
      <a-sphere position="1.8 -0.8 -1" radius="0.04"
                material="color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.6"
                animation="property: scale; from: 0.3 0.3 0.3; to: 1.8 1.8 1.8; dur: 1400; dir: alternate; loop: true; easing: easeInOutSine; delay: 300"></a-sphere>

      <!-- Extra depth spheres -->
      <a-sphere position="-2.2 -2.5 -2" radius="0.08" color="#F1060B" material="roughness: 0.5"
                animation__bob="property: position; from: -2.2 -2.5 -2; to: -2.2 -2.1 -2; dur: 3600; dir: alternate; loop: true; easing: easeInOutSine"></a-sphere>
      <a-sphere position="2.2 -1.5 -2.5" radius="0.1" color="#68BD56" material="roughness: 0.5"
                animation__bob="property: position; from: 2.2 -1.5 -2.5; to: 2.2 -1.1 -2.5; dur: 4200; dir: alternate; loop: true; easing: easeInOutSine"></a-sphere>

    </a-scene>
  </div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- ===== HTML OVERLAY ===== -->
  <div class="overlay" id="overlay">

    <div class="top">
      <div class="brand">Disney \u00b7 Pixar</div>
      <div class="title-wrap">
        <div class="t-toy">TOY</div>
        <div class="t-story-row"><span class="t-story">STORY</span></div>
        <div class="t-five">5</div>
      </div>
    </div>

    <div class="mid">
      <div class="tagline">Le Jouet Contre la Tech</div>
    </div>

    <div class="bot">
      <div class="sub">L\u2019aventure continue au cin\u00e9ma</div>
      <div class="date">19 Juin 2026</div>
      <a class="cta" id="ctaBtn" href="https://movies.disney.com/toy-story-5" target="_blank">D\u00e9couvrir</a>
      <div class="hint"><span>\ud83d\udc46 Touchez l\u2019\u00e9cran pour jouer</span></div>
      <div class="legal">\u00a9 2026 Disney/Pixar. Tous droits r\u00e9serv\u00e9s.</div>
    </div>

  </div>
</div>

<script>
(function() {
  var canFire = true;

  function spawnConfetti() {
    if (!canFire) return;
    canFire = false;
    setTimeout(function() { canFire = true; }, 700);

    var scene = document.querySelector('a-scene');
    if (!scene) return;
    var colors = ['#FFEE15','#F1060B','#68BD56','#87539B','#F7C026','#3170A9','#FFFFFF'];
    var types = ['a-box','a-sphere'];

    for (var i = 0; i < 20; i++) {
      var el = document.createElement(types[Math.floor(Math.random() * types.length)]);
      var angle = Math.random() * Math.PI * 2;
      var speed = 1.5 + Math.random() * 2.5;
      var sx = 0, sy = 0, sz = 1.5;
      var ex = Math.cos(angle) * speed;
      var ey = Math.sin(angle) * speed;
      var ez = sz + (Math.random() - 0.5) * 2;
      var size = 0.06 + Math.random() * 0.1;
      var dur = 600 + Math.random() * 600;
      var color = colors[Math.floor(Math.random() * colors.length)];

      el.setAttribute('position', sx + ' ' + sy + ' ' + sz);
      el.setAttribute('color', color);
      el.setAttribute('material', 'emissive:' + color + ';emissiveIntensity:0.4;transparent:true');

      if (el.tagName.toLowerCase() === 'a-box') {
        el.setAttribute('width', String(size));
        el.setAttribute('height', String(size));
        el.setAttribute('depth', String(size));
      } else {
        el.setAttribute('radius', String(size * 0.6));
      }

      el.setAttribute('animation', {
        property: 'position',
        to: ex + ' ' + ey + ' ' + ez,
        dur: dur,
        easing: 'easeOutCubic'
      });
      el.setAttribute('animation__rot', {
        property: 'rotation',
        to: String(Math.random()*720) + ' ' + String(Math.random()*720) + ' ' + String(Math.random()*720),
        dur: dur,
        easing: 'linear'
      });
      el.setAttribute('animation__fade', {
        property: 'material.opacity',
        from: 1,
        to: 0,
        dur: dur * 0.85,
        delay: dur * 0.15,
        easing: 'easeInQuad'
      });

      scene.appendChild(el);

      (function(element, d) {
        setTimeout(function() {
          if (element.parentNode) element.parentNode.removeChild(element);
        }, d + 300);
      })(el, dur);
    }

    /* Bounce existing toys with stagger */
    var toys = scene.querySelectorAll('.toy');
    toys.forEach(function(toy, idx) {
      setTimeout(function() {
        toy.setAttribute('animation__tap', {
          property: 'scale',
          to: '1.35 1.35 1.35',
          dur: 150,
          easing: 'easeOutQuad'
        });
        setTimeout(function() {
          toy.setAttribute('animation__tap', {
            property: 'scale',
            to: '1 1 1',
            dur: 400,
            easing: 'easeOutElastic'
          });
        }, 160);
      }, idx * 35);
    });

    /* Glitch the tablet screen */
    var scr = document.getElementById('tabletScreen');
    if (scr) {
      scr.setAttribute('animation__glitch', {
        property: 'material.emissiveIntensity',
        from: 0.4,
        to: 1.0,
        dur: 80,
        dir: 'alternate',
        loop: 4,
        easing: 'linear'
      });
      setTimeout(function() {
        scr.removeAttribute('animation__glitch');
        scr.setAttribute('material', 'emissiveIntensity', 0.4);
      }, 700);
    }

    /* Shrink tablet then bounce back */
    var tablet = document.getElementById('tablet');
    if (tablet) {
      tablet.setAttribute('animation__shake', {
        property: 'scale',
        to: '0.85 0.85 0.85',
        dur: 150,
        easing: 'easeInQuad'
      });
      setTimeout(function() {
        tablet.setAttribute('animation__shake', {
          property: 'scale',
          to: '1 1 1',
          dur: 500,
          easing: 'easeOutElastic'
        });
      }, 160);
    }
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target.closest('#ctaBtn')) return;
    spawnConfetti();
  });

  document.getElementById('overlay').addEventListener('touchstart', function(e) {
    if (e.target.closest('#ctaBtn')) return;
    e.preventDefault();
    spawnConfetti();
  }, { passive: false });
})();
</script>
</body>
</html>
