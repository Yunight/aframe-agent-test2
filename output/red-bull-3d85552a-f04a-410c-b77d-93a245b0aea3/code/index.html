<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Bull Bowl Rippers 2026</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<div class="ad-gallery">

  <!-- 320x480 : Immersive Vertical Carousel -->
  <div id="ad-320x480" class="ad-unit">
    <div class="slides-320">
      <img class="slide-320 active" src="./robin-bolian-360-indy-marseille-teddy-morellec.jpg" alt="Robin Bolian en plein 360 Indy au-dessus du bowl de Marseille" draggable="false">
      <img class="slide-320" src="./skateboarding-sandro-dias-estaiadinha-bridge.jpg" alt="Sandro Dias en skateboard sur le pont Estaiadinha" draggable="false">
      <img class="slide-320" src="./skateboarding.jpg" alt="Skateboarding en action dans le bowl" draggable="false">
      <img class="slide-320" src="./spot-skate-marseille.jpg" alt="Spot de skate emblematique a Marseille" draggable="false">
    </div>
    <div class="gradient-320"></div>
    <div class="overlay-320">
      <div class="top-320">
        <img class="logo-320" src="./red-bull-bowl-rippers-2026-logo.png" alt="Red Bull Bowl Rippers 2026 logo officiel" draggable="false">
      </div>
      <div class="spacer-320"></div>
      <div class="bottom-320">
        <h2 class="headline-320">BOWL RIPPERS</h2>
        <p class="date-320">MARSEILLE &middot; 2026</p>
        <p class="tagline-320">L'&eacute;lite mondiale du bowl skate</p>
        <button class="cta cta-320" data-label="D&Eacute;COUVRIR">D&Eacute;COUVRIR</button>
      </div>
      <div class="dots-320">
        <span class="dot active" data-index="0"></span>
        <span class="dot" data-index="1"></span>
        <span class="dot" data-index="2"></span>
        <span class="dot" data-index="3"></span>
      </div>
    </div>
  </div>

  <!-- 336x280 : Editorial Split -->
  <div id="ad-336x280" class="ad-unit">
    <div class="img-panel-336">
      <img class="hero-336" src="./red-bull-bowl-rippers-2020-adrien-bruguiere.jpg" alt="Adrien Bruguiere en action lors du Red Bull Bowl Rippers 2020" draggable="false">
    </div>
    <div class="content-panel-336">
      <div class="stripe-336"></div>
      <img class="logo-336" src="./red-bull-bowl-rippers-2026-logo.png" alt="Red Bull Bowl Rippers 2026" draggable="false">
      <h2 class="headline-336">BOWL<br>RIPPERS</h2>
      <p class="date-336">MARSEILLE &middot; 2026</p>
      <p class="tagline-336">Vivez l'adr&eacute;naline</p>
      <button class="cta cta-336" data-label="D&Eacute;COUVRIR">D&Eacute;COUVRIR</button>
    </div>
  </div>

  <!-- 300x250 : Ambient Venue -->
  <div id="ad-300x250" class="ad-unit">
    <div class="bg-wrap-250">
      <img class="bg-250" src="./the-famous-du-prado-concrete-skate-bowl-on-the-waterfront-in-marseille.jpg" alt="Le celebre bowl en beton du Prado sur le front de mer a Marseille" draggable="false">
    </div>
    <div class="overlay-250">
      <img class="logo-250" src="./red-bull-bowl-rippers-2026-logo.png" alt="Red Bull Bowl Rippers 2026" draggable="false">
      <h2 class="headline-250">BOWL RIPPERS</h2>
      <p class="date-250">MARSEILLE &middot; 2026</p>
      <button class="cta cta-250" data-label="D&Eacute;COUVRIR">D&Eacute;COUVRIR</button>
    </div>
  </div>

</div>
</body>
</html>
