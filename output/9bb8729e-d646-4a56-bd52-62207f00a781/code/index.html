<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <title>Spider-Man: Brand New Day</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:320px;height:480px;overflow:hidden;background:#0D0D1F;}
    .ad-container{position:relative;width:320px;height:480px;overflow:hidden;}
    a-scene{position:absolute!important;top:0;left:0;width:320px!important;height:480px!important;}
    .ui-overlay{position:absolute;top:0;left:0;width:320px;height:480px;pointer-events:none;z-index:100;display:flex;flex-direction:column;font-family:'Roboto Condensed','Arial Narrow',sans-serif;}
    .ui-top{padding:14px 16px 35px;text-align:center;background:linear-gradient(to bottom,rgba(13,13,31,0.97) 0%,rgba(13,13,31,0.75) 55%,transparent 100%);animation:fadeSlideDown 1s ease-out 0.3s both;}
    .marvel-badge{display:inline-block;background:#DF1F2D;color:#FFF;font-size:7px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:3px 8px;margin-bottom:6px;}
    .title-main{color:#FFF;font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:4px;line-height:1;text-shadow:0 0 30px rgba(223,31,45,0.6),0 0 60px rgba(223,31,45,0.3),0 2px 4px rgba(0,0,0,0.9);}
    .title-sub{color:#447BBE;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:6px;margin-top:3px;text-shadow:0 0 20px rgba(68,123,190,0.6),0 2px 4px rgba(0,0,0,0.9);}
    .ui-spacer{flex:1;}
    .ui-bottom{padding:35px 20px 16px;text-align:center;background:linear-gradient(to top,rgba(13,13,31,0.97) 0%,rgba(13,13,31,0.8) 55%,transparent 100%);animation:fadeSlideUp 1s ease-out 1.2s both;}
    .tagline{color:#C0C0C0;font-size:12px;font-weight:400;line-height:1.6;margin-bottom:10px;text-shadow:0 1px 4px rgba(0,0,0,0.8);}
    .release-info{color:#FFF;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
    .release-info span{color:#DF1F2D;font-size:16px;}
    .cta-btn{pointer-events:all;display:inline-block;background:linear-gradient(135deg,#DF1F2D 0%,#B11313 100%);color:#FFF;font-family:'Roboto Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:11px 26px;border:none;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;animation:ctaGlow 2.5s ease-in-out infinite;}
    .cta-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);animation:shimmer 3s ease-in-out infinite;}
    @keyframes ctaGlow{0%,100%{box-shadow:0 0 15px rgba(223,31,45,0.4),0 0 30px rgba(223,31,45,0.2);transform:scale(1);}50%{box-shadow:0 0 25px rgba(223,31,45,0.7),0 0 50px rgba(223,31,45,0.3);transform:scale(1.03);}}
    @keyframes shimmer{0%{left:-100%;}50%,100%{left:100%;}}
    @keyframes fadeSlideDown{from{opacity:0;transform:translateY(-15px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
    .vignette{position:absolute;top:0;left:0;width:320px;height:480px;z-index:60;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.55) 100%);}
    .web-svg{position:absolute;top:0;left:0;width:320px;height:480px;z-index:55;pointer-events:none;opacity:0.1;}
    .web-burst{position:absolute;width:50px;height:50px;border-radius:50%;border:1.5px solid rgba(223,31,45,0.6);z-index:90;pointer-events:none;animation:burstExpand 0.6s ease-out forwards;}
    .web-burst.blue{border-color:rgba(68,123,190,0.5);}
    @keyframes burstExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:1;}100%{transform:translate(-50%,-50%) scale(3);opacity:0;}}
    .web-line{position:absolute;z-index:85;pointer-events:none;height:1px;width:0;background:linear-gradient(90deg,rgba(192,192,192,0.4),transparent);transform-origin:0 0;animation:webShoot 0.5s ease-out forwards;}
    @keyframes webShoot{0%{width:0;opacity:1;}100%{width:80px;opacity:0;}}
  </style>
</head>
<body>
<div class="ad-container" id="adContainer">

  <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true; alpha: false" loading-screen="enabled: false">
    <a-assets timeout="10000">
      <img id="poster" src="spiderman_brand_new_day_ver2.jpg" crossorigin="anonymous">
      <img id="emblem" src="Spiderman-Logo-No-Background.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 5" fov="80" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

    <a-sky color="#0D0D1F"></a-sky>

    <!-- Atmospheric glows -->
    <a-circle position="-0.5 1.5 -3" radius="3.5" material="color: #DF1F2D; opacity: 0.1; shader: flat" animation="property: material.opacity; from: 0.06; to: 0.16; dur: 4000; easing: easeInOutSine; loop: true; dir: alternate"></a-circle>
    <a-circle position="0.5 -1 -2.5" radius="2.5" material="color: #2B3784; opacity: 0.08; shader: flat" animation="property: material.opacity; from: 0.04; to: 0.13; dur: 5000; easing: easeInOutSine; loop: true; dir: alternate"></a-circle>
    <a-circle position="1 2 -2" radius="1.5" material="color: #447BBE; opacity: 0.06; shader: flat" animation="property: material.opacity; from: 0.03; to: 0.09; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate"></a-circle>

    <!-- Main poster -->
    <a-image id="heroPoster" src="#poster" position="0 0.2 0" width="3.6" height="5.34" material="shader: flat; opacity: 1" animation="property: scale; from: 0.85 0.85 0.85; to: 1 1 1; dur: 1000; easing: easeOutCubic; delay: 200" animation__fadeIn="property: material.opacity; from: 0; to: 1; dur: 800; delay: 200"></a-image>

    <!-- Spider emblem floating in foreground -->
    <a-entity id="emblemParent" position="0 -0.8 1.5" animation__float="property: position; from: 0 -1.1 1.5; to: 0 -0.5 1.5; dur: 4500; loop: true; dir: alternate; easing: easeInOutSine">
      <a-image id="spiderEmblem" src="#emblem" position="0 0 0" width="1.1" height="1.52" material="shader: flat; transparent: true; opacity: 0.12" animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 25000; loop: true; easing: linear" animation__pulse="property: material.opacity; from: 0.06; to: 0.2; dur: 3000; loop: true; dir: alternate; easing: easeInOutSine"></a-image>
    </a-entity>

    <!-- Web strands -->
    <a-entity geometry="primitive: cylinder; radius: 0.007; height: 12" material="color: #C0C0C0; opacity: 0.22; shader: flat" position="-1.8 0 0.8" rotation="0 0 10" animation="property: rotation; from: 0 0 10; to: 0 0 15; dur: 5000; loop: true; dir: alternate; easing: easeInOutSine"></a-entity>
    <a-entity geometry="primitive: cylinder; radius: 0.007; height: 12" material="color: #C0C0C0; opacity: 0.22; shader: flat" position="2 0 0.7" rotation="0 0 -8" animation="property: rotation; from: 0 0 -8; to: 0 0 -14; dur: 4500; loop: true; dir: alternate; easing: easeInOutSine"></a-entity>
    <a-entity geometry="primitive: cylinder; radius: 0.004; height: 10" material="color: #C0C0C0; opacity: 0.13; shader: flat" position="-0.6 0 1.1" rotation="0 0 4" animation="property: rotation; from: 0 0 4; to: 0 0 9; dur: 6000; loop: true; dir: alternate; easing: easeInOutSine"></a-entity>
    <a-entity geometry="primitive: cylinder; radius: 0.004; height: 10" material="color: #C0C0C0; opacity: 0.13; shader: flat" position="0.8 0 1" rotation="0 0 -18" animation="property: rotation; from: 0 0 -18; to: 0 0 -12; dur: 5500; loop: true; dir: alternate; easing: easeInOutSine"></a-entity>
    <a-entity geometry="primitive: cylinder; radius: 0.003; height: 10" material="color: #C0C0C0; opacity: 0.08; shader: flat" position="0.2 0 0.9" rotation="0 0 40" animation="property: rotation; from: 0 0 40; to: 0 0 45; dur: 7000; loop: true; dir: alternate; easing: easeInOutSine"></a-entity>
    <a-entity geometry="primitive: cylinder; radius: 0.003; height: 10" material="color: #C0C0C0; opacity: 0.08; shader: flat" position="-0.2 0 0.9" rotation="0 0 -35" animation="property: rotation; from: 0 0 -35; to: 0 0 -30; dur: 6500; loop: true; dir: alternate; easing: easeInOutSine"></a-entity>

    <!-- Floating particles -->
    <a-sphere position="-1.2 2.8 0.5" radius="0.025" material="color: #DF1F2D; shader: flat; opacity: 0.7" animation="property: position; from: -1.2 2.8 0.5; to: -1.4 2.5 0.5; dur: 4000; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
    <a-sphere position="1.5 2 0.6" radius="0.018" material="color: #447BBE; shader: flat; opacity: 0.5" animation="property: position; from: 1.5 2 0.6; to: 1.3 2.2 0.6; dur: 3500; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
    <a-sphere position="0.9 -2.8 0.4" radius="0.022" material="color: #DF1F2D; shader: flat; opacity: 0.6" animation="property: position; from: 0.9 -2.8 0.4; to: 0.7 -3 0.4; dur: 3000; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
    <a-sphere position="-1 -2 0.7" radius="0.015" material="color: #447BBE; shader: flat; opacity: 0.4" animation="property: position; from: -1 -2 0.7; to: -1.2 -1.8 0.7; dur: 5000; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
    <a-sphere position="0.3 3.5 0.3" radius="0.02" material="color: #FFF; shader: flat; opacity: 0.3" animation="property: position; from: 0.3 3.5 0.3; to: 0.5 3.3 0.3; dur: 4500; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
    <a-sphere position="-0.5 -3.2 0.6" radius="0.018" material="color: #FFF; shader: flat; opacity: 0.2" animation="property: position; from: -0.5 -3.2 0.6; to: -0.3 -3.4 0.6; dur: 5500; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>

    <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
  </a-scene>

  <!-- SVG Web pattern overlay -->
  <svg class="web-svg" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg">
    <line x1="160" y1="-10" x2="0" y2="490" stroke="white" stroke-width="0.6"/>
    <line x1="160" y1="-10" x2="320" y2="490" stroke="white" stroke-width="0.6"/>
    <line x1="160" y1="-10" x2="50" y2="240" stroke="white" stroke-width="0.35"/>
    <line x1="160" y1="-10" x2="270" y2="240" stroke="white" stroke-width="0.35"/>
    <line x1="160" y1="-10" x2="-20" y2="300" stroke="white" stroke-width="0.25"/>
    <line x1="160" y1="-10" x2="340" y2="300" stroke="white" stroke-width="0.25"/>
    <path d="M 90 100 Q 160 70 230 100" fill="none" stroke="white" stroke-width="0.4"/>
    <path d="M 50 190 Q 160 140 270 190" fill="none" stroke="white" stroke-width="0.35"/>
    <path d="M 10 300 Q 160 230 310 300" fill="none" stroke="white" stroke-width="0.3"/>
    <path d="M -20 420 Q 160 330 340 420" fill="none" stroke="white" stroke-width="0.25"/>
  </svg>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <div class="ui-top">
      <div class="marvel-badge">MARVEL STUDIOS</div>
      <div class="title-main">SPIDER-MAN</div>
      <div class="title-sub">BRAND NEW DAY</div>
    </div>
    <div class="ui-spacer"></div>
    <div class="ui-bottom">
      <div class="tagline">Un nouveau chapitre commence.<br>Le h\u00E9ros que personne ne conna\u00EEt.</div>
      <div class="release-info">AU CIN\u00C9MA LE <span>31 JUILLET</span></div>
      <a class="cta-btn" href="https://spidermanbrandnewday.movie/" target="_blank">R\u00C9SERVER MES PLACES</a>
    </div>
  </div>

</div>

<script>
  var container = document.getElementById('adContainer');

  function handleMove(x, y) {
    var rect = container.getBoundingClientRect();
    var nx = (x - rect.left) / rect.width - 0.5;
    var ny = (y - rect.top) / rect.height - 0.5;
    var poster = document.getElementById('heroPoster');
    if (poster) {
      poster.setAttribute('rotation', { x: ny * -8, y: nx * 12, z: 0 });
    }
  }

  container.addEventListener('mousemove', function(e) {
    handleMove(e.clientX, e.clientY);
  });

  container.addEventListener('touchmove', function(e) {
    e.preventDefault();
    handleMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  container.addEventListener('mouseleave', function() {
    var poster = document.getElementById('heroPoster');
    if (poster) poster.setAttribute('rotation', { x: 0, y: 0, z: 0 });
  });

  function createWebBurst(cx, cy) {
    var rect = container.getBoundingClientRect();
    var lx = cx - rect.left;
    var ly = cy - rect.top;
    for (var i = 0; i < 3; i++) {
      var burst = document.createElement('div');
      burst.className = 'web-burst' + (i === 1 ? ' blue' : '');
      burst.style.left = lx + 'px';
      burst.style.top = ly + 'px';
      burst.style.animationDelay = (i * 0.12) + 's';
      container.appendChild(burst);
      (function(b){ setTimeout(function(){ b.remove(); }, 900); })(burst);
    }
    for (var j = 0; j < 8; j++) {
      var line = document.createElement('div');
      line.className = 'web-line';
      line.style.left = lx + 'px';
      line.style.top = ly + 'px';
      line.style.transform = 'rotate(' + (j * 45) + 'deg)';
      line.style.animationDelay = (j * 0.03) + 's';
      container.appendChild(line);
      (function(l){ setTimeout(function(){ l.remove(); }, 800); })(line);
    }
  }

  container.addEventListener('click', function(e) {
    createWebBurst(e.clientX, e.clientY);
  });

  container.addEventListener('touchstart', function(e) {
    if (e.touches.length > 0) {
      createWebBurst(e.touches[0].clientX, e.touches[0].clientY);
    }
  });
</script>
</body>
</html>
