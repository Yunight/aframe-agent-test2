<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lindt — Nouveautés du moment · Creatives</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <!--
    ASSET NOTES (described before use):
    - ./133-1331304_lindt-logo-png-lindt-logo-transparent-png.png : official Lindt wordmark in dark red italic script with the "MAITRES CHOCOLATIERS SUISSES DEPUIS 1845" tagline beneath. Primary brand signature, used in every ad.
    - ./logo-sydney-monochrome-symbol-chocolate.jpg : monochrome circular chocolate seal symbol. Used as a small premium badge in Ad 2.
    - ./pi_en_lindor_1kg_strawberry.png : LINDOR strawberry & cream pouch hero shot. Reveal product in Ad 1.
    - ./a8bb0b9dc3e0b048cde12657278a09193073efac6912745bf08ab3fa48fbbb36.png : Lindt new creation packshot. Hero of the Tokyo / Matcha & Fraise editorial in Ad 4.
    - ./assortiment-chocolats-au-lait-fruite-lindor.jpg : assorted milk fruity LINDOR truffles bowl. Carousel slide in Ad 2.
    - ./sac-1kg-lindor-assorti-lindt.jpg : LINDOR 1kg assortment bag. Carousel slide in Ad 2.
    - ./lindt-cornet-assortiment-boules-lindor-337g-x1.jpg : LINDOR 337g paper cornet of assorted balls. Game catcher in Ad 3 + carousel slide in Ad 2.
    - ./lindt_lindor_strawberries_cream_chocolate_truffles_box_200g.png : LINDOR strawberries & cream 200g box. Falling pieces in Ad 3.
    - ./10773435_0.jpg : Lindt premium product packshot. Carousel slide in Ad 2.
  -->

  <main class="gallery" aria-label="Lindt — quatre formats publicitaires interactifs">

    <!-- ============ AD 1 — UNWRAP REVEAL ============ -->
    <figure class="slot">
      <section class="ad ad-unwrap" data-ad="unwrap" aria-label="Lindt — Déballez l'instant">
        <div class="u-bg"></div>
        <div class="u-bokeh" aria-hidden="true"></div>

        <header class="ad-top">
          <img class="logo" src="./133-1331304_lindt-logo-png-lindt-logo-transparent-png.png" alt="Lindt — Maîtres Chocolatiers Suisses" />
        </header>

        <p class="eyebrow">Édition découverte</p>
        <h2 class="display">Déballez<br/><em>l'instant.</em></h2>

        <div class="truffle-stage" id="truffleStage">
          <div class="truffle-shadow" aria-hidden="true"></div>
          <button class="foil" id="foilEl" aria-label="Déballer la truffe">
            <span class="foil-half foil-top"></span>
            <span class="foil-half foil-bot"></span>
            <span class="foil-hint">Touchez ✦</span>
          </button>
          <img class="u-product" src="./pi_en_lindor_1kg_strawberry.png" alt="LINDOR Fraise &amp; Crème" />
          <div class="glow-ring" aria-hidden="true"></div>
        </div>

        <p class="u-caption" id="uCaption">LINDOR Fraise &amp; Crème — <em>Nouveau</em></p>
        <a class="cta cta-gold" href="#" id="unwrapCta">Découvrir les nouveautés</a>

        <footer class="ad-bot">
          <span>Maîtres Chocolatiers Suisses depuis 1845</span>
        </footer>
      </section>
      <figcaption class="slot-label">01 · Reveal Unwrap</figcaption>
    </figure>

    <!-- ============ AD 2 — 3D COVERFLOW CAROUSEL ============ -->
    <figure class="slot">
      <section class="ad ad-carousel" data-ad="carousel" aria-label="Lindt — Galerie des nouveautés">
        <div class="c-bg"></div>
        <div class="c-grain" aria-hidden="true"></div>

        <header class="ad-top dark">
          <img class="logo on-dark" src="./133-1331304_lindt-logo-png-lindt-logo-transparent-png.png" alt="Lindt" />
          <img class="seal" src="./logo-sydney-monochrome-symbol-chocolate.jpg" alt="Sceau chocolat" />
        </header>

        <p class="eyebrow gold">Les nouveautés du moment</p>
        <h2 class="display light">Trésors<br/><em>chocolatés.</em></h2>

        <div class="coverflow" id="coverflow">
          <div class="cf-card" data-i="0">
            <img src="./assortiment-chocolats-au-lait-fruite-lindor.jpg" alt="LINDOR Lait Fruité" />
            <span class="badge">Nouveau</span>
          </div>
          <div class="cf-card" data-i="1">
            <img src="./sac-1kg-lindor-assorti-lindt.jpg" alt="LINDOR Assorti 1kg" />
            <span class="badge">Best-seller</span>
          </div>
          <div class="cf-card" data-i="2">
            <img src="./lindt-cornet-assortiment-boules-lindor-337g-x1.jpg" alt="Cornet LINDOR 337g" />
            <span class="badge">Partage</span>
          </div>
          <div class="cf-card" data-i="3">
            <img src="./10773435_0.jpg" alt="EXCELLENCE Cocoa Pure" />
            <span class="badge">Édition limitée</span>
          </div>
        </div>

        <div class="c-meta">
          <button class="arrow" id="prevBtn" aria-label="Précédent">‹</button>
          <div class="c-info">
            <p class="prod-name" id="cName">LINDOR Lait Fruité</p>
            <p class="prod-tag" id="cTag">L'instant fondant</p>
          </div>
          <button class="arrow" id="nextBtn" aria-label="Suivant">›</button>
        </div>

        <div class="dots" id="dots" role="tablist"></div>
        <a class="cta cta-light" href="#">Découvrir la collection</a>
      </section>
      <figcaption class="slot-label">02 · Premium Coverflow</figcaption>
    </figure>

    <!-- ============ AD 3 — PLUIE DE CHOCOLAT (mini-game) ============ -->
    <figure class="slot">
      <section class="ad ad-game" data-ad="game" aria-label="Lindt — Pluie de chocolat">
        <div class="g-bg"></div>

        <header class="ad-top">
          <img class="logo" src="./133-1331304_lindt-logo-png-lindt-logo-transparent-png.png" alt="Lindt" />
          <div class="score-pill" id="scorePill"><span id="score">0</span>/5</div>
        </header>

        <div class="g-stage" id="gameStage">

          <div class="g-state g-intro" id="gIntro">
            <p class="eyebrow">Mini-jeu</p>
            <h2 class="display">Pluie de<br/><em>LINDOR.</em></h2>
            <p class="lead">Attrapez 5 truffes en 15 s et déverrouillez votre offre nouveauté.</p>
            <button class="cta cta-primary" id="startBtn">Commencer</button>
          </div>

          <div class="g-state g-play" id="gPlay" hidden>
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            <div class="falling-area" id="fallingArea" aria-hidden="true"></div>
            <div class="catcher" id="catcher">
              <img src="./lindt-cornet-assortiment-boules-lindor-337g-x1.jpg" alt="Cornet LINDOR" />
            </div>
            <p class="play-hint">Glissez pour déplacer le cornet</p>
          </div>

          <div class="g-state g-end" id="gEnd" hidden>
            <div class="win-burst" aria-hidden="true"></div>
            <p class="eyebrow gold" id="endEye">Bravo&nbsp;!</p>
            <h2 class="display" id="endTitle"><em>−10%</em><br/>nouveautés.</h2>
            <p class="lead" id="endLead">Votre code de réduction est prêt.</p>
            <div class="code-tag" id="codeTag">CODE&nbsp;:&nbsp;<b>LINDOR10</b></div>
            <a class="cta cta-primary" href="#" id="claimBtn">Réclamer mon offre</a>
            <button class="replay" id="replayBtn">Rejouer</button>
          </div>

        </div>
      </section>
      <figcaption class="slot-label">03 · Catch Game</figcaption>
    </figure>

    <!-- ============ AD 4 — TOKYO EDITORIAL ============ -->
    <figure class="slot">
      <section class="ad ad-tokyo" data-ad="tokyo" aria-label="Lindt — Matcha &amp; Fraise inspiré de Tokyo">
        <div class="t-bg"></div>
        <div class="sakura" id="sakura" aria-hidden="true"></div>
        <div class="ink-circle" aria-hidden="true"></div>

        <header class="ad-top">
          <img class="logo" src="./133-1331304_lindt-logo-png-lindt-logo-transparent-png.png" alt="Lindt" />
        </header>

        <p class="eyebrow tag-jp"><span class="kanji">東京</span> · Inspiré de Tokyo</p>
        <h2 class="display">Matcha<br/><em>&amp; Fraise.</em></h2>
        <p class="lead">Chocolat blanc · édition limitée par les Maîtres Chocolatiers.</p>

        <div class="t-stage">
          <div class="halo" aria-hidden="true"></div>
          <img class="t-product" src="./a8bb0b9dc3e0b048cde12657278a09193073efac6912745bf08ab3fa48fbbb36.png" alt="Matcha &amp; Fraise — chocolat blanc" />
        </div>

        <svg class="ink-stroke" viewBox="0 0 240 16" aria-hidden="true">
          <path d="M2,9 C40,2 80,14 120,8 C160,2 200,14 238,7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </svg>

        <a class="cta cta-brush" href="#">Goûtez l'expérience</a>
        <footer class="ad-bot tokyo">EXCELLENCE · Maîtres Chocolatiers Suisses</footer>
      </section>
      <figcaption class="slot-label">04 · Tokyo Editorial</figcaption>
    </figure>

  </main>
</body>
</html>
