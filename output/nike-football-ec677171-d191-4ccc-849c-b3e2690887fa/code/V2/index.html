<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nike Off-Pitch Looks France – 300x250</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Header bar -->
    <div class="ad-header">
      <img src="./Logo_NIKE.svg" alt="logo" class="nike-logo">
      <span class="eyebrow">Collection France</span>
    </div>

    <!-- Carousel slides -->
    <div class="carousel-track" id="carouselTrack">
      <div class="slide active" data-index="0">
        <img src="./FFF_M_NK_DF_JSY_SS_STAD_HM.jpg" alt="Maillot domicile FFF" class="slide-img">
        <div class="slide-label">
          <span class="subhead">Maillot Domicile</span>
        </div>
      </div>
      <div class="slide" data-index="1">
        <img src="./FFF_M_NK_DF_JSY_SS_STAD_AW.jpg" alt="Maillot extérieur FFF" class="slide-img">
        <div class="slide-label">
          <span class="subhead">Maillot Extérieur</span>
        </div>
      </div>
      <div class="slide" data-index="2">
        <img src="./FFF_M_NK_DF_ENERGY_JKT_W.jpg" alt="Veste Energy FFF" class="slide-img">
        <div class="slide-label">
          <span class="subhead">Veste Energy</span>
        </div>
      </div>
      <div class="slide" data-index="3">
        <img src="./FFF_M_NK_DF_ENERGY_TOP_SS.jpg" alt="Polo Energy FFF" class="slide-img">
        <div class="slide-label">
          <span class="subhead">Polo Energy</span>
        </div>
      </div>
      <div class="slide" data-index="4">
        <img src="./FFF_M_NK_DF_ENERGY_PANT_W.jpg" alt="Pantalon Energy FFF" class="slide-img">
        <div class="slide-label">
          <span class="subhead">Pantalon Energy</span>
        </div>
      </div>
      <div class="slide" data-index="5">
        <img src="./NIKE_AIR_MAX_PLUS_OG_PRM.jpg" alt="Nike Air Max Plus OG" class="slide-img">
        <div class="slide-label">
          <span class="subhead">Air Max Plus OG</span>
        </div>
      </div>
    </div>

    <!-- Headline overlay -->
    <div class="headline-block">
      <h1 class="headline">STYLE <em>LES BLEUS</em></h1>
      <p class="body-copy">Looks off-pitch à porter partout</p>
    </div>

    <!-- Dot nav -->
    <div class="dot-nav" id="dotNav">
      <button class="dot active" data-slide="0" aria-label="Slide 1"></button>
      <button class="dot" data-slide="1" aria-label="Slide 2"></button>
      <button class="dot" data-slide="2" aria-label="Slide 3"></button>
      <button class="dot" data-slide="3" aria-label="Slide 4"></button>
      <button class="dot" data-slide="4" aria-label="Slide 5"></button>
      <button class="dot" data-slide="5" aria-label="Slide 6"></button>
    </div>

    <!-- Footer CTA -->
    <div class="ad-footer">
      <a class="cta-btn" href="https://www.nike.com/fr/w/off-pitch-looks-france-9wreezabxgs">
        <span class="cta-label">Découvrir la collection</span>
      </a>
      <span class="footer-legal">Nike.com</span>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
