<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYD Sealion 5 DM-i – 300×250</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-300x250">
    <!-- Background layer -->
    <div class="ad-bg"></div>

    <!-- Animated accent line -->
    <div class="accent-line"></div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./langfr-250px-BYD_Auto_2022_logo.svg.png" alt="BYD" class="ad-logo">
      <span class="ad-tag">SUPER HYBRIDE</span>
    </header>

    <!-- Product image carousel -->
    <div class="ad-hero">
      <img src="./byd-sealion5-dmi-1stBanner-l.webp" alt="BYD Sealion 5 DM-i" class="hero-img active" data-index="0">
      <img src="./byd-sealion5-dmi-exterior-01-xl.webp" alt="BYD Sealion 5 DM-i profil" class="hero-img" data-index="1">
      <img src="./byd-sealion5-dmi-exterior-02-xl.webp" alt="BYD Sealion 5 DM-i face" class="hero-img" data-index="2">
    </div>

    <!-- Content overlay -->
    <div class="ad-content">
      <div class="ad-eyebrow">Nouveau</div>
      <h1 class="ad-headline">SEALION 5 DM-i</h1>
      <p class="ad-sub">SUV rechargeable<br>à partir de <strong>36 990 €</strong></p>
    </div>

    <!-- Carousel dots -->
    <div class="carousel-dots">
      <span class="dot active" data-dot="0"></span>
      <span class="dot" data-dot="1"></span>
      <span class="dot" data-dot="2"></span>
    </div>

    <!-- CTA -->
    <footer class="ad-footer">
      <a href="https://www.byd.com/fr/vehicules-hybrides/sealion-5-dm-i" class="ad-cta" target="_blank" rel="noopener">Découvrir maintenant</a>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
