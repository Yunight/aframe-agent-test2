<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYD SEALION 5 DM-i</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="ad-320x480">

    <!-- Header -->
    <header class="ad-header">
      <img src="./langfr-250px-BYD_Auto_2022_logo.svg.png"
           alt="BYD" class="byd-logo" draggable="false">
      <span class="badge">Super Hybride</span>
    </header>

    <!-- Hero Carousel -->
    <div class="hero" id="heroCarousel">

      <div class="slide is-active">
        <img src="./byd-sealion5-dmi-1stBanner-l.webp"
             alt="SEALION 5 DM-i vue 3/4 avant"
             class="slide-img"
             style="object-position:72% center">
      </div>

      <div class="slide">
        <img src="./byd-sealion5-dmi-exterior-01-xl.webp"
             alt="SEALION 5 DM-i profil latéral"
             class="slide-img"
             style="object-position:center 45%">
      </div>

      <div class="slide">
        <img src="./byd-sealion5-dmi-exterior-02-xl.webp"
             alt="SEALION 5 DM-i face avant"
             class="slide-img"
             style="object-position:center 30%">
      </div>

      <div class="hero-overlay" aria-hidden="true"></div>

      <nav class="dots" aria-label="Navigation galerie">
        <button class="dot is-active" data-goto="0" aria-label="Vue 1 sur 3"></button>
        <button class="dot" data-goto="1" aria-label="Vue 2 sur 3"></button>
        <button class="dot" data-goto="2" aria-label="Vue 3 sur 3"></button>
      </nav>

    </div>

    <!-- Content Body -->
    <div class="ad-body">

      <div class="name-block">
        <h1 class="car-name">SEALION 5 <mark>DM-i</mark></h1>
        <p class="car-sub">SUV Super Hybride Rechargeable</p>
      </div>

      <div class="specs-row" aria-label="Caractéristiques clés">
        <div class="spec">
          <strong class="spec-val counter" data-to="1050">0</strong>
          <span class="spec-unit">km</span>
          <small class="spec-lbl">d'autonomie*</small>
        </div>
        <div class="spec-rule" aria-hidden="true"></div>
        <div class="spec">
          <strong class="spec-val counter" data-to="78">0</strong>
          <span class="spec-unit">km</span>
          <small class="spec-lbl">100% élec.</small>
        </div>
        <div class="spec-rule" aria-hidden="true"></div>
        <div class="spec">
          <strong class="spec-val counter" data-to="204">0</strong>
          <span class="spec-unit">ch</span>
          <small class="spec-lbl">puissance</small>
        </div>
      </div>

      <a class="cta"
         href="https://www.byd.com/fr/vehicules-hybrides/sealion-5-dm-i"
         target="_blank" rel="noopener noreferrer">
        Découvrir maintenant
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <p class="legal">*Autonomie WLTP combinée. Offre soumise à conditions.</p>

    </div>

  </div>

  <script src="app.js" defer></script>
</body>
</html>
