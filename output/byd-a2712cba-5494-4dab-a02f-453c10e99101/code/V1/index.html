<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYD Sealion 5 DM-i — 320×480</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <!-- Background layer -->
    <div class="ad-bg" aria-hidden="true"></div>

    <!-- Particles -->
    <div class="particles" aria-hidden="true">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
    </div>

    <!-- Header -->
    <header class="ad-header">
      <img src="./langfr-250px-BYD_Auto_2022_logo.svg.png" alt="BYD" class="ad-logo">
      <span class="ad-badge">NOUVEAU</span>
    </header>

    <!-- Hero carousel -->
    <div class="hero-wrap">
      <div class="hero-track" id="heroTrack">
        <div class="hero-slide">
          <img src="./byd-sealion5-dmi-1stBanner-l.webp" alt="BYD Sealion 5 DM-i vue 3/4" class="hero-img hero-banner">
        </div>
        <div class="hero-slide">
          <img src="./byd-sealion5-dmi-exterior-01-xl.webp" alt="Sealion 5 DM-i profil" class="hero-img hero-profile">
        </div>
        <div class="hero-slide">
          <img src="./byd-sealion5-dmi-exterior-02-xl.webp" alt="Sealion 5 DM-i face avant" class="hero-img hero-front">
        </div>
      </div>
      <div class="hero-stripe" aria-hidden="true"></div>
      <div class="carousel-dots" id="carouselDots">
        <button class="dot active" data-index="0" aria-label="Diapositive 1"></button>
        <button class="dot" data-index="1" aria-label="Diapositive 2"></button>
        <button class="dot" data-index="2" aria-label="Diapositive 3"></button>
      </div>
    </div>

    <!-- Content -->
    <div class="ad-content">
      <p class="tag-line">SUV SUPER HYBRIDE</p>
      <h1 class="headline">SEALION 5 <span class="dmi">DM-i</span></h1>
      <p class="subhead">Jusqu'à <strong>1 200 km</strong> d'autonomie totale*</p>

      <div class="specs-row">
        <div class="spec-item">
          <span class="spec-val">81</span>
          <span class="spec-unit">km</span>
          <span class="spec-lbl">électrique</span>
        </div>
        <div class="spec-sep"></div>
        <div class="spec-item">
          <span class="spec-val">166</span>
          <span class="spec-unit">ch</span>
          <span class="spec-lbl">puissance</span>
        </div>
        <div class="spec-sep"></div>
        <div class="spec-item">
          <span class="spec-val">3,8</span>
          <span class="spec-unit">L/100</span>
          <span class="spec-lbl">mixte</span>
        </div>
      </div>

      <a href="https://www.byd.com/fr/vehicules-hybrides/sealion-5-dm-i"
         class="cta-btn" id="ctaBtn"
         target="_blank" rel="noopener">
        Découvrir le Sealion 5
        <svg class="cta-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <p class="legal">*Autonomie totale combinée. Données WLTP indicatives.</p>
    </div>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
