<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peugeot 308 SW – Gamme Thermique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <header class="ad-header">
      <div class="logo-wrap">
        <img src="./Peugeot_2021_Logo.svg" alt="logo" class="ad-logo">
      </div>
      <span class="brand-name">PEUGEOT</span>
      <span class="pro-badge">PRO</span>
    </header>

    <div class="carousel-wrapper" id="carousel">
      <img src="./PEUGEOT_IMAGE_308SW_F2_810x455.png" alt="Peugeot 308 SW studio" class="carousel-img active">
      <img src="./Nouvelle-peugeot-308-SW-bleue-hybride-2022.jpg" alt="Peugeot 308 SW hybride 2022" class="carousel-img">
      <img src="./peugeot-308-2022-blanc-ar-mk-bd.jpg" alt="Peugeot 308 blanc vue arriere" class="carousel-img">
      <img src="./nouvelle-peugeot-308-2021.jpg" alt="Peugeot 308 urbain 2021" class="carousel-img">
      <img src="./PEUGEOT_IMAGE_308_F2_810x455.png" alt="Peugeot 308 berline studio" class="carousel-img">
      <div class="carousel-fade"></div>
      <div class="carousel-bar">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="carousel-dots">
        <button class="dot active" data-idx="0" aria-label="Visuel 1"></button>
        <button class="dot" data-idx="1" aria-label="Visuel 2"></button>
        <button class="dot" data-idx="2" aria-label="Visuel 3"></button>
        <button class="dot" data-idx="3" aria-label="Visuel 4"></button>
        <button class="dot" data-idx="4" aria-label="Visuel 5"></button>
      </div>
    </div>

    <div class="ad-content">
      <p class="eyebrow">GAMME THERMIQUE</p>
      <h1 class="headline">NOUVELLE<em>308 SW</em></h1>
      <p class="subhead">Le break qui repousse les limites</p>
      <p class="body-copy">Essence · Hybride rechargeable</p>
    </div>

    <div class="ad-cta-area">
      <a class="cta-btn" href="https://www.peugeot.fr/offres-pro/gamme-thermique.html">
        <span class="cta-label">DECOUVRIR L'OFFRE PRO</span>
        <svg class="cta-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" focusable="false">
          <path d="M2 7h10M8 3l4 4-4 4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <div class="ad-footer">
      <span>Offres reservees aux professionnels. Sous conditions. Voir details en concession.</span>
    </div>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
