<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peugeot 308 SW – Offres Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <!-- Header bar -->
    <div class="ad-header">
      <img src="./Peugeot_2021_Logo.svg" alt="logo" class="ad-logo">
      <span class="eyebrow">OFFRES PRO</span>
    </div>

    <!-- Slideshow hero -->
    <div class="slideshow" id="slideshow">
      <div class="slide active" data-index="0">
        <img src="./PEUGEOT_IMAGE_308SW_F2_810x455.png" alt="Peugeot 308 SW bleu studio" class="slide-img">
      </div>
      <div class="slide" data-index="1">
        <img src="./Nouvelle-peugeot-308-SW-bleue-hybride-2022.jpg" alt="Peugeot 308 SW hybride bleue" class="slide-img">
      </div>
      <div class="slide" data-index="2">
        <img src="./peugeot-308-2022-blanc-ar-mk-bd.jpg" alt="Peugeot 308 blanc bord de mer" class="slide-img">
      </div>
      <div class="slide" data-index="3">
        <img src="./nouvelle-peugeot-308-2021.jpg" alt="Peugeot 308 urbaine" class="slide-img">
      </div>
      <div class="slide" data-index="4">
        <img src="./PEUGEOT_IMAGE_308_F2_810x455.png" alt="Peugeot 308 bleu studio" class="slide-img">
      </div>

      <!-- Slide counter dots -->
      <div class="slide-dots" id="slideDots">
        <span class="dot active" data-dot="0"></span>
        <span class="dot" data-dot="1"></span>
        <span class="dot" data-dot="2"></span>
        <span class="dot" data-dot="3"></span>
        <span class="dot" data-dot="4"></span>
      </div>

      <!-- Slide label overlay -->
      <div class="slide-label" id="slideLabel">308 SW — Break</div>
    </div>

    <!-- Copy block -->
    <div class="copy-block">
      <h1 class="headline">NOUVELLE <em>308 SW</em></h1>
      <p class="subhead">Polyvalence &amp; Élégance Française</p>
      <p class="body-copy">Jusqu'à 1 548 L de coffre. Hybride rechargeable disponible. Faite pour les pros exigeants.</p>
    </div>

    <!-- CTA + Footer -->
    <div class="ad-bottom">
      <a class="cta-btn" href="https://www.peugeot.fr/offres-pro/gamme-thermique.html"><span class="cta-label">Découvrir les offres</span></a>
      <p class="ad-footer"><span>Offre réservée aux professionnels. Sous conditions.</span></p>
    </div>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
