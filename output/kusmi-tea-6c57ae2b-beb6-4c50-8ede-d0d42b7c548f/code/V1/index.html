<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusmi Tea — Matcha Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ad-320x480">

    <div class="botanical-bg"></div>
    <div class="particles-container" aria-hidden="true" id="particlesContainer"></div>

    <header class="logo-band">
      <img src="./logo_black.svg" alt="logo" class="logo-img">
    </header>

    <p class="eyebrow">Cérémonie du thé</p>

    <div class="product-hero" id="productHero">
      <div class="product-halo" aria-hidden="true"></div>
      <img
        src="./Nav_Push_Matcha_Premium_2026.jpg"
        alt="Matcha Premium Kusmi Tea"
        class="product-img"
        id="productImg"
      >
    </div>

    <div class="text-zone">
      <h1 class="headline" id="headline" aria-label="MATCHA PREMIUM">
        <span class="headline-word" id="word1"></span>
        <span class="headline-word" id="word2"></span>
      </h1>
      <p class="subhead"><em>Thé vert du Japon · 100% Bio</em></p>
      <div class="badges">
        <span class="badge">AB Bio</span>
        <span class="badge">100% Japon</span>
        <span class="price">À partir de 14,90 €</span>
      </div>
    </div>

    <div class="cta-zone">
      <a class="cta-btn" href="https://www.kusmitea.com/products/matcha-premium" target="_blank" rel="noopener">
        <span class="cta-label">Découvrir</span>
      </a>
    </div>

    <footer class="ad-footer">
      <span>kusmitea.com · Bio · Made in Normandy</span>
    </footer>

  </div>
  <script src="app.js" defer></script>
</body>
</html>
