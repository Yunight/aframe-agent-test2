<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diablo IV: Lord of Hatred – 320×480</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ad-320x480">
    <!-- Background layers -->
    <div class="bg-overlay"></div>
    <div class="ember-container" id="emberContainer"></div>

    <!-- Header: Logo -->
    <header class="ad-header">
      <img src="./Diablo_IV_Logo-3000x1402.png" alt="Diablo IV" class="brand-logo" />
    </header>

    <!-- Hero image carousel -->
    <div class="hero-carousel">
      <div class="hero-slide active" style="background-image:url('./Diablo-IV-Lord-of-Hatred-2.webp')"></div>
      <div class="hero-slide" style="background-image:url('./Best-Class-Tier-list-Diablo-IV-Lord-of-Hatred-780x439.jpg')"></div>
      <div class="hero-slide" style="background-image:url('./diablo-iv-lord-of-hatred-ultimate-edition-xbox-series-x-s-xbox-one-microsoft-store-cover.jpg')"></div>
      <div class="hero-slide" style="background-image:url('./Diablo-IV-Lord-of-Hatred-Skovos-Region-Guide-Cover-780x439.png')"></div>
    </div>

    <!-- Gradient vignette over hero -->
    <div class="hero-vignette"></div>

    <!-- Carousel dots -->
    <div class="carousel-dots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
      <span class="dot" data-index="3"></span>
    </div>

    <!-- Content panel -->
    <div class="content-panel">
      <div class="expansion-label">EXTENSION</div>
      <h1 class="headline">SEIGNEUR<br/>DE LA HAINE</h1>
      <p class="subhead">Affrontez Méphisto.<br/>Conquérez Skovos.</p>
      <div class="divider"></div>
      <p class="body-copy">La nouvelle extension de<br/>Diablo IV est disponible.</p>
      <a class="cta-button" href="https://diablo4.blizzard.com/fr-fr/lord-of-hatred" target="_blank">
        JOUER MAINTENANT
      </a>
      <p class="legal">© 2025 Blizzard Entertainment. Tous droits réservés.</p>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
