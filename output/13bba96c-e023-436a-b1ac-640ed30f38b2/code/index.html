<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <title>Mortal Kombat II - Au Cinéma</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:320px;height:480px;overflow:hidden;background:#000000}
    #ad{width:320px;height:480px;position:relative;overflow:hidden;background:#121212}
    #ad .a-scene{position:absolute!important;top:0;left:0}

    /* === UI OVERLAY === */
    #ui{position:absolute;top:0;left:0;width:320px;height:480px;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center}

    .hdr{width:100%;text-align:center;padding:10px 16px 18px;position:relative;z-index:20;background:linear-gradient(to bottom,rgba(18,18,18,0.92) 0%,rgba(18,18,18,0.6) 60%,transparent 100%)}
    .cinema-tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;color:#C9B037;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:5px;opacity:0.85}
    .mk-logo{width:55px;height:auto;filter:drop-shadow(0 0 12px rgba(244,57,40,0.45)) drop-shadow(0 0 28px rgba(244,57,40,0.15))}

    .mid{flex:1}

    .ftr{width:100%;text-align:center;position:relative;z-index:20;background:linear-gradient(to top,rgba(0,0,0,0.96) 0%,rgba(0,0,0,0.82) 40%,rgba(0,0,0,0.4) 75%,transparent 100%);padding:24px 16px 10px}
    .tagline{font-family:'Bebas Neue',sans-serif;font-size:15px;font-weight:700;color:#ECDE29;letter-spacing:0.14em;text-shadow:0 0 10px rgba(236,222,41,0.35);margin-bottom:2px}
    .char-name{font-family:'Bebas Neue',sans-serif;font-size:38px;font-weight:700;color:#F43928;letter-spacing:0.05em;line-height:1;text-shadow:0 0 20px rgba(244,57,40,0.5),0 2px 6px rgba(0,0,0,0.9);transition:opacity 0.2s ease}
    .dots{display:flex;gap:10px;justify-content:center;margin:7px 0 5px}
    .dot{width:8px;height:8px;border-radius:50%;background:#E0E0E0;opacity:0.2;transition:all 0.3s ease}
    .dot.on{opacity:1;background:#F43928;box-shadow:0 0 10px rgba(244,57,40,0.6);transform:scale(1.25)}
    .hint{font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:#E0E0E0;opacity:0.4;margin-bottom:10px}

    .cta-row{display:flex;align-items:center;justify-content:center;gap:8px}
    .dragon-badge{width:28px;height:28px;filter:drop-shadow(0 0 6px rgba(244,57,40,0.4));opacity:0.75}
    .cta{pointer-events:auto;display:inline-block;padding:11px 26px;background:linear-gradient(135deg,#F43928 0%,#F27C1F 100%);color:#000000;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.12em;border:2px solid #ECDE29;text-decoration:none;cursor:pointer;animation:glow 2.5s ease-in-out infinite;transition:transform 0.15s ease}
    .cta:hover{transform:scale(1.05)}
    .cta:active{transform:scale(0.97)}
    @keyframes glow{0%,100%{box-shadow:0 0 15px rgba(244,57,40,0.3)}50%{box-shadow:0 0 30px rgba(244,57,40,0.6),0 0 50px rgba(242,124,31,0.15)}}

    .brand{margin-top:7px;display:flex;align-items:center;justify-content:center}
    .brand img{height:14px;width:auto;opacity:0.35;filter:brightness(2)}
    .legal{font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:400;color:#E0E0E0;opacity:0.2;margin-top:3px}

    .tap-zone{position:absolute;top:75px;left:0;width:320px;height:240px;z-index:15;pointer-events:auto;cursor:pointer}

    .flash{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);font-family:'Bebas Neue',sans-serif;font-size:56px;font-weight:700;color:#ECDE29;text-shadow:0 0 30px rgba(236,222,41,0.8),0 0 60px rgba(244,57,40,0.4);z-index:30;pointer-events:none;opacity:0;letter-spacing:0.08em}
    .flash.go{animation:flashA 0.55s ease-out forwards}
    @keyframes flashA{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}50%{opacity:0.9;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

    .sflash{position:absolute;top:0;left:0;width:320px;height:480px;z-index:25;pointer-events:none;background:rgba(244,57,40,0.12);opacity:0;transition:opacity 0.08s ease}
  </style>
</head>
<body>
<div id="ad">
  <!-- =========== A-FRAME 3D SCENE =========== -->
  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="colorManagement:true; antialias:true"
           background="color: #121212"
           loading-screen="enabled: false">
    <a-assets timeout="15000">
      <img id="a-baraka" src="./mortal-kombat-2-character-poster-baraka_1752781391.webp">
      <img id="a-kitana" src="./mortal-kombat-2-character-poster-kitana_1752780897.webp">
      <img id="a-raiden" src="./mortal-kombat-2-character-poster-raiden_1752780746.webp">
      <img id="a-dragon" src="./Mortal-Kombat-Logo-PNG-Transparent.png">
      <img id="a-poster" src="./mortal-kombat-ii-official-poster_1772132652.webp">
      <img id="a-teaser" src="./mortal-kombat-ii-official-teaser-poster_1757361602.webp">
      <img id="a-mk2a" src="./mortal_kombat_two.jpg">
      <img id="a-mk2b" src="./mortal_kombat_two_ver23.jpg">
      <img id="a-mk2c" src="./mortal_kombat_two_ver26.jpg">
    </a-assets>

    <!-- Camera -->
    <a-entity camera="fov: 55" position="0 0 5" look-controls="enabled: false"></a-entity>

    <!-- Background plane -->
    <a-plane position="0 0 -7" width="22" height="22" material="color: #121212; shader: flat"></a-plane>

    <!-- Far background: official poster, very faded -->
    <a-image src="#a-poster" position="0 0 -5.5" width="2.8" height="4.15"
             material="transparent: true; opacity: 0.04; shader: flat"></a-image>

    <!-- Far background: teaser poster, tilted, very faded -->
    <a-image src="#a-teaser" position="1.5 0.5 -5" width="1.5" height="2.22"
             rotation="0 -15 5"
             material="transparent: true; opacity: 0.03; shader: flat"
             animation="property: position; from: 1.5 0.4 -5; to: 1.5 0.6 -5; dur: 6000; easing: easeInOutSine; loop: true; dir: alternate"></a-image>

    <!-- Scattered small poster planes for depth atmosphere -->
    <a-image src="#a-mk2a" position="-2.2 -1.5 -4.2" width="0.7" height="0.87"
             rotation="0 12 -8"
             material="transparent: true; opacity: 0.05; shader: flat"
             animation="property: rotation; from: 0 12 -8; to: 0 12 -4; dur: 5000; easing: easeInOutSine; loop: true; dir: alternate"></a-image>
    <a-image src="#a-mk2b" position="2.5 1.8 -4" width="0.55" height="0.82"
             rotation="0 -10 6"
             material="transparent: true; opacity: 0.04; shader: flat"
             animation="property: rotation; from: 0 -10 6; to: 0 -10 2; dur: 4500; easing: easeInOutSine; loop: true; dir: alternate"></a-image>
    <a-image src="#a-mk2c" position="-1.8 2.2 -4.5" width="0.65" height="0.81"
             rotation="0 8 10"
             material="transparent: true; opacity: 0.04; shader: flat"
             animation="property: rotation; from: 0 8 10; to: 0 8 6; dur: 5500; easing: easeInOutSine; loop: true; dir: alternate"></a-image>

    <!-- Pulsing glow auras behind character -->
    <a-circle id="glow1" position="0 -0.2 -3" radius="2.2"
              material="color: #8B0000; opacity: 0.1; transparent: true; shader: flat"
              animation="property: material.opacity; from: 0.06; to: 0.16; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate"></a-circle>
    <a-circle id="glow2" position="0 -0.1 -2.9" radius="1.3"
              material="color: #F43928; opacity: 0.08; transparent: true; shader: flat"
              animation="property: material.opacity; from: 0.04; to: 0.12; dur: 1800; easing: easeInOutSine; loop: true; dir: alternate"></a-circle>
    <a-circle position="0 0 -2.8" radius="0.7"
              material="color: #F27C1F; opacity: 0.06; transparent: true; shader: flat"
              animation="property: material.opacity; from: 0.02; to: 0.1; dur: 1400; easing: easeInOutSine; loop: true; dir: alternate"></a-circle>

    <!-- Dragon logo floating in background -->
    <a-image src="#a-dragon" position="0 1.8 -3.5" width="2" height="2"
             material="transparent: true; opacity: 0.1; shader: flat"
             animation="property: position; from: 0 1.7 -3.5; to: 0 1.9 -3.5; dur: 3200; easing: easeInOutSine; loop: true; dir: alternate"
             animation__rot="property: rotation; from: 0 0 -3; to: 0 0 3; dur: 5000; easing: easeInOutSine; loop: true; dir: alternate"
             animation__pulse="property: material.opacity; from: 0.06; to: 0.14; dur: 2200; easing: easeInOutSine; loop: true; dir: alternate"></a-image>

    <!-- Characters (3 cycling hero images) -->
    <a-image id="c0" src="#a-baraka" position="0 -0.3 -1.2" width="2.7" height="4.0"
             material="transparent: true; shader: flat"></a-image>
    <a-image id="c1" src="#a-kitana" position="8 -0.3 -1.2" width="2.7" height="4.0"
             material="transparent: true; shader: flat"></a-image>
    <a-image id="c2" src="#a-raiden" position="8 -0.3 -1.2" width="2.7" height="3.38"
             material="transparent: true; shader: flat"></a-image>

    <!-- Spark particles container -->
    <a-entity id="sparks"></a-entity>

    <!-- Scene lighting -->
    <a-light type="ambient" color="#1A1A2E" intensity="0.5"></a-light>
    <a-light type="point" color="#F43928" intensity="0.7" position="0 3 2"
             animation="property: intensity; from: 0.5; to: 0.9; dur: 2000; easing: easeInOutSine; loop: true; dir: alternate"></a-light>
    <a-light type="point" color="#F27C1F" intensity="0.3" position="-2 -2 2"></a-light>
    <a-light type="point" color="#4A0E4E" intensity="0.2" position="2 0 3"></a-light>
  </a-scene>

  <!-- =========== HTML UI OVERLAY =========== -->
  <div id="ui">
    <div class="hdr">
      <div class="cinema-tag">&#9876; Maintenant au cin&eacute;ma &#9876;</div>
      <img class="mk-logo" src="./Mortal-Kombat-Logo-PNG-Transparent.png" alt="Mortal Kombat II">
    </div>
    <div class="mid"></div>
    <div class="ftr">
      <div class="tagline">CHOISISSEZ VOTRE COMBATTANT</div>
      <div class="char-name" id="nm">BARAKA</div>
      <div class="dots">
        <div class="dot on" data-i="0"></div>
        <div class="dot" data-i="1"></div>
        <div class="dot" data-i="2"></div>
      </div>
      <div class="hint">&larr; Glissez ou appuyez &rarr;</div>
      <div class="cta-row">
        <img class="dragon-badge" src="./Mortal-Kombat-Logo-Transparent-Background.png" alt="">
        <a href="https://www.mortalkombatmovie.com/" class="cta" target="_blank">R&Eacute;SERVEZ VOS PLACES</a>
      </div>
      <div class="brand">
        <img src="./372246-middle.png" alt="Warner Bros.">
      </div>
      <div class="legal">&copy; 2026 Warner Bros. Entertainment Inc.</div>
    </div>
  </div>

  <!-- Tap zone for character switching -->
  <div class="tap-zone" id="tz"></div>

  <!-- Fight flash text -->
  <div class="flash" id="fl">FIGHT!</div>

  <!-- Screen flash on switch -->
  <div class="sflash" id="sf"></div>
</div>

<script>
(function() {
  var C = [
    { n: 'BARAKA', a: '#F27C1F' },
    { n: 'KITANA', a: '#4A0E4E' },
    { n: 'RAIDEN', a: '#C9B037' }
  ];
  var idx = 0, busy = false, timer;
  var sparkColors = ['#F43928', '#F27C1F', '#ECDE29', '#C9B037', '#8B0000'];

  function initSparks() {
    var el = document.getElementById('sparks');
    for (var j = 0; j < 25; j++) {
      var s = document.createElement('a-plane');
      var x = (Math.random() - 0.5) * 6;
      var sy = -3.5 + Math.random() * 0.5;
      var ey = 3.5 + Math.random();
      var sz = 0.02 + Math.random() * 0.04;
      var d = 2500 + Math.random() * 3500;
      var dl = Math.random() * 4000;
      var c = sparkColors[Math.floor(Math.random() * sparkColors.length)];
      s.setAttribute('width', sz);
      s.setAttribute('height', sz * (0.5 + Math.random()));
      s.setAttribute('material', 'color:' + c + '; shader:flat; transparent:true; opacity:0.6');
      s.setAttribute('position', x + ' ' + sy + ' ' + (Math.random() * 2 - 0.5));
      s.setAttribute('animation', 'property:position; to:' + (x + (Math.random() - 0.5) * 2) + ' ' + ey + ' ' + (Math.random() * 2 - 0.5) + '; dur:' + d + '; delay:' + dl + '; easing:linear; loop:true');
      s.setAttribute('animation__f', 'property:material.opacity; from:0.7; to:0; dur:' + d + '; delay:' + dl + '; easing:easeInQuad; loop:true');
      el.appendChild(s);
    }
  }

  function go(dir) {
    if (busy) return;
    busy = true;

    var cur = document.getElementById('c' + idx);
    var ox = dir > 0 ? -7 : 7;

    cur.setAttribute('animation__m', 'property:position; to:' + ox + ' -0.3 -1.2; dur:280; easing:easeInBack');
    cur.setAttribute('animation__r', 'property:rotation; to:0 ' + (dir > 0 ? -20 : 20) + ' 0; dur:280; easing:easeInBack');

    var sf = document.getElementById('sf');
    sf.style.opacity = '1';
    setTimeout(function() { sf.style.opacity = '0'; }, 80);

    var fl = document.getElementById('fl');
    fl.classList.remove('go');
    void fl.offsetWidth;
    fl.classList.add('go');

    idx = (idx + dir + C.length) % C.length;
    var nm = document.getElementById('nm');
    nm.style.opacity = '0';

    setTimeout(function() {
      nm.textContent = C[idx].n;
      nm.style.opacity = '1';

      document.querySelectorAll('.dot').forEach(function(d, j) {
        d.classList.toggle('on', j === idx);
      });

      document.getElementById('glow1').setAttribute('material', 'color', C[idx].a);
      document.getElementById('glow2').setAttribute('material', 'color', C[idx].a);

      var nxt = document.getElementById('c' + idx);
      var ix = dir > 0 ? 7 : -7;
      nxt.setAttribute('position', ix + ' -0.3 -1.2');
      nxt.setAttribute('rotation', '0 ' + (dir > 0 ? 20 : -20) + ' 0');

      setTimeout(function() {
        nxt.setAttribute('animation__m', 'property:position; to:0 -0.3 -1.2; dur:400; easing:easeOutBack');
        nxt.setAttribute('animation__r', 'property:rotation; to:0 0 0; dur:400; easing:easeOutBack');
        setTimeout(function() { busy = false; }, 400);
      }, 30);
    }, 280);
  }

  var tz = document.getElementById('tz'), sx = 0, wasTch = false;

  tz.addEventListener('touchstart', function(e) {
    sx = e.touches[0].clientX;
    wasTch = true;
  }, { passive: true });

  tz.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - sx;
    go(Math.abs(dx) > 25 ? (dx < 0 ? 1 : -1) : 1);
    resetT();
  });

  tz.addEventListener('click', function() {
    if (wasTch) { wasTch = false; return; }
    go(1);
    resetT();
  });

  function resetT() {
    clearInterval(timer);
    timer = setInterval(function() { go(1); }, 4000);
  }

  document.querySelector('a-scene').addEventListener('loaded', function() {
    initSparks();
    timer = setInterval(function() { go(1); }, 4000);
  });
})();
</script>
</body>
</html>
